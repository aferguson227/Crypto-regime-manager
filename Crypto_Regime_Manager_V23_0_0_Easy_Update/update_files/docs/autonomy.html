<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Autonomous Evolution</title><style>:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:1100px;margin:auto;padding:22px 16px 60px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-weight:750;font-size:13px}.nav a.active{background:#eef5ff;color:#091626}.card{border:1px solid var(--line);background:rgba(16,29,48,.96);border-radius:24px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#091626;border:1px solid var(--line);border-radius:16px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:18px}.muted{color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}.notice{background:#372d16;border:1px solid #78622b;color:#ffe29a;border-radius:14px;padding:14px}.winner{border:2px solid var(--ok)}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}</style><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v23.css"></head><body><main><h1>Autonomous Research Evolution</h1><p class="muted">Chooses the next research branch, runs controlled experiments and publishes an advisory bridge to bot decisions.</p><nav class="v20-nav"><a href="index.html">Dashboard</a><a href="cockpit.html">Cockpit</a><a href="research.html">Research</a><a href="discovery.html">Discovery</a><a href="data.html">Data</a><a class="active" href="more.html">More</a></nav><div class="v20-tools"><a href="explainability.html">Why this decision</a><a href="timeline.html">Timeline</a><a href="integrity.html">Data integrity</a></div><div id="content"><section class="card">Loading…</section></div><script>const e=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const f=(n,d=1)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';fetch('strategies.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{const a=d.autonomous_evolution;if(!a)throw Error('Run the main workflow.');let h=`<section class="card"><h2>${e(a.source_asset)} · ${e(a.target_regime)}</h2><div class="grid"><div class="metric"><span>Dominant family</span><strong>${e(a.dominant_family)}</strong></div><div class="metric"><span>Experiments</span><strong>${f(a.audit.experiments_run,0)}</strong></div><div class="metric"><span>Passed</span><strong>${f(a.audit.passed,0)}</strong></div><div class="metric"><span>Mode</span><strong>V${e(a.version)}</strong></div></div></section>`;h+=(a.experiments||[]).map((x,i)=>`<section class="card ${i===0?'winner':''}"><h2>#${x.rank} ${e(x.title)} <span class="${x.status==='PASS'?'ok':'bad'}">${e(x.status)}</span></h2><p class="muted">${e(x.amendment.human_rule)}</p><div class="grid"><div class="metric"><span>Net P&L</span><strong>$${f(x.metrics.net_pnl,2)}</strong></div><div class="metric"><span>P&L change</span><strong>$${f(x.comparison.net_pnl_change,2)}</strong></div><div class="metric"><span>Duration reduction</span><strong>${f(x.comparison.duration_reduction_hours/24)}d</strong></div><div class="metric"><span>Research score</span><strong>${f(x.score,2)}</strong></div></div></section>`).join('');const b=a.decision_bridge||{};h+=`<section class="card"><h2>Decision bridge</h2><div class="grid"><div class="metric"><span>Status</span><strong>${e(b.status)}</strong></div><div class="metric"><span>Confidence</span><strong>${f(b.confidence_pct)}%</strong></div><div class="metric"><span>DCA</span><strong>${e(b.dca_settings)}</strong></div><div class="metric"><span>Live execution</span><strong class="bad">NO</strong></div></div><p>${e(b.recommended_action)}</p><p class="notice">${e(a.note)}</p></section>`;document.getElementById('content').innerHTML=h}).catch(x=>document.getElementById('content').innerHTML=`<section class="card"><h2>Could not load</h2><p>${e(x.message)}</p></section>`)</script></main><a class="v23-dashboard-home" href="index.html">← Dashboard</a></body></html>
