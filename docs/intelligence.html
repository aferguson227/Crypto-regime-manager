<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Trading Intelligence</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--blue:#6db7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100vh}main{max-width:960px;margin:auto;padding:22px 16px 50px}h1{margin:0}.muted{color:var(--muted)}.nav{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-size:13px;font-weight:750}.nav a.active{background:#eef5ff;color:#091626}.summary,.card{border:1px solid var(--line);background:rgba(16,29,48,.96);border-radius:24px;padding:20px;margin:15px 0}.summary{background:linear-gradient(135deg,#132944,#101d30)}.rank{font-size:14px;letter-spacing:.12em;color:var(--muted)}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.score{font-size:42px;font-weight:900}.badge{padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;background:#25405e}.allowed{background:#164e3c}.blocked{background:#6d2531}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.metric{background:#091626;border:1px solid var(--line);border-radius:16px;padding:13px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:17px}.cols{display:grid;grid-template-columns:1fr;gap:12px}.panel{background:#091626;border:1px solid var(--line);border-radius:16px;padding:15px}.panel h3{margin:0 0 8px}.panel ul{padding-left:20px;margin:0;color:var(--muted);line-height:1.65}.ok li::marker{color:var(--ok)}.warn li::marker{color:var(--warn)}@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}.cols{grid-template-columns:1fr 1fr}}
</style><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.0.0"></head><body><main><h1>Trading Intelligence</h1><p class="muted">Production opportunity ranking for TEL and TAO; SUI remains research-only</p><nav class="v20-nav"><a href="index.html">Dashboard</a><a href="cockpit.html">Cockpit</a><a href="research.html">Research</a><a href="discovery.html">Discovery</a><a href="data.html">Data</a><a class="active" href="more.html">More</a></nav><div class="v20-tools"><a href="explainability.html">Why this decision</a><a href="timeline.html">Timeline</a><a href="integrity.html">Data integrity</a></div><div id="content"><section class="card">Loading…</section></div><script>
const fmt=(n,d=2)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){const r=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),pf=d.portfolio||{},best=pf.best_opportunity,rankMap=Object.fromEntries((pf.ranking||[]).map(x=>[x.id,x]));document.getElementById('content').innerHTML=`<section class="summary"><div class="rank">PORTFOLIO VIEW · V${esc(d.version)}</div><h2>${best?'Best eligible setup: '+esc(best.symbol):'No eligible setup right now'}</h2><p class="muted">${esc(pf.operating_rule||'')}</p><div class="grid"><div class="metric"><span>Eligible</span><strong>${fmt(pf.eligible_count,0)} / ${fmt(pf.monitored_assets,0)}</strong></div><div class="metric"><span>Open replay positions</span><strong>${fmt(pf.active_replay_positions,0)}</strong></div><div class="metric"><span>Combined max capital</span><strong>$${fmt(pf.combined_max_theoretical_capital,0)}</strong></div><div class="metric"><span>Updated</span><strong>${window.V26Time?window.V26Time.formatLocal(d.generated_at,false):new Date(d.generated_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</strong></div></div></section>`+d.assets.filter(a=>a.production_status==='production').slice().sort((a,b)=>(b.intelligence?.opportunity_score||0)-(a.intelligence?.opportunity_score||0)).map((a,i)=>{const x=a.intelligence||{},l=a.latest||{},h=a.health||{},v=rankMap[a.id]||{},shownScore=v.score??x.opportunity_score;return `<section class="card"><div class="top"><div><div class="rank">#${i+1} · ${esc(a.symbol)} · ${esc(l.regime)}</div><h2>${esc(x.action||'—')}</h2><div class="muted">${esc(l.recommended_bot||'')}</div></div><div><div class="score">${fmt(shownScore,0)}</div><span class="badge ${l.entry_allowed?'allowed':'blocked'}">${l.entry_allowed?'ENTRY ALLOWED':'ENTRY BLOCKED'}</span></div></div><div class="grid"><div class="metric"><span>Health</span><strong>${fmt(h.score,0)} · ${esc(h.status||'—')}</strong></div><div class="metric"><span>Recent 90d P&L</span><strong>$${fmt(h.recent_realised_pnl,2)}</strong></div><div class="metric"><span>Recent drawdown</span><strong>${fmt(h.recent_max_drawdown_pct_of_capital,1)}%</strong></div><div class="metric"><span>Classification</span><strong>${esc(String(v.classification||x.confidence_label||'—').replaceAll('_',' '))}</strong></div></div><div class="cols"><div class="panel ok"><h3>Why it ranks here</h3><ul>${(x.explanation||[]).map(v=>`<li>${esc(v)}</li>`).join('')||'<li>No positive factors recorded.</li>'}</ul></div><div class="panel warn"><h3>Cautions</h3><ul>${(x.cautions||[]).map(v=>`<li>${esc(v)}</li>`).join('')||'<li>No additional cautions recorded.</li>'}</ul></div></div><p class="muted" style="font-size:12px">${esc(x.note||'')}</p></section>`}).join('')};load().catch(e=>document.getElementById('content').innerHTML=`<section class="card"><h2>Could not load intelligence</h2><p>${esc(e.message)}</p></section>`);
</script></main><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.0.0"></script></body></html>
