<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Evidence Library</title><style>:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--purple:#b193e0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:1100px;margin:auto;padding:22px 16px 60px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-weight:750;font-size:13px}.nav a.active{background:#eef5ff;color:#091626}.card{border:1px solid var(--line);background:rgba(16,29,48,.96);border-radius:24px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric,.item{background:#091626;border:1px solid var(--line);border-radius:16px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:18px}.muted{color:var(--muted)}.badge{display:inline-block;background:#563b78;padding:8px 12px;border-radius:999px;font-weight:800}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.winner{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}.notice{background:#372d16;border:1px solid #78622b;color:#ffe29a;border-radius:14px;padding:14px}.asset{margin-top:10px}.IMPROVED{color:var(--ok)}.DEGRADED{color:var(--bad)}.NEUTRAL{color:var(--warn)}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}</style><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"><link rel="stylesheet" href="workspace.css?v=37.0.0"><link rel="stylesheet" href="design-system.css?v=37.0.0"></head><body><main><h1>Multi-Asset Evidence Library</h1><p class="muted">Tests whether promising research rules transfer across TEL, TAO, and SUI</p><nav class="v20-nav"><a href="index.html">Dashboard</a><a href="cockpit.html">Cockpit</a><a href="research.html">Research</a><a href="discovery.html">Discovery</a><a href="data.html">Data</a><a class="active" href="more.html">More</a></nav><div class="v20-tools"><a href="explainability.html">Why this decision</a><a href="timeline.html">Timeline</a><a href="integrity.html">Data integrity</a></div><div id="content"><section class="card">Loading cross-asset evidence…</section></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const f=(n,d=1)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';const money=n=>`${Number(n)<0?'−':''}$${f(Math.abs(Number(n)||0),2)}`;function asset(x){const c=x.comparison||{},b=x.baseline||{},n=x.candidate||{};return `<div class="item asset"><h3>${esc(x.asset_id)} <span class="${esc(x.outcome)}">${esc(x.outcome)}</span></h3><div class="grid"><div class="metric"><span>Baseline P&L</span><strong>${money(b.net_pnl)}</strong></div><div class="metric"><span>Candidate P&L</span><strong>${money(n.net_pnl)}</strong></div><div class="metric"><span>P&L change</span><strong>${money(c.net_pnl_change)}</strong></div><div class="metric"><span>Duration reduction</span><strong>${f((c.duration_reduction_hours||0)/24)}d</strong></div><div class="metric"><span>Drawdown change</span><strong>${f(c.drawdown_change_pp)}pp</strong></div><div class="metric"><span>Deals</span><strong>${f(c.candidate_closed_deals,0)} / ${f(c.baseline_closed_deals,0)}</strong></div></div></div>`}async function load(){const r=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'}),d=await r.json(),e=d.evidence_library;if(!e)throw new Error('Evidence results are not available. Run the main workflow.');const rec=e.recommendation||{};document.getElementById('content').innerHTML=`<section class="card"><span class="badge">RESEARCH ONLY</span><h2>${esc(rec.name||'No recommendation')}</h2><p class="warn"><strong>${esc(rec.verdict||'NO EVIDENCE')}</strong></p><p>${esc(rec.next_action||'')}</p><div class="grid"><div class="metric"><span>Rules tested</span><strong>${f(e.audit?.rules_tested,0)}</strong></div><div class="metric"><span>Assets tested</span><strong>${f(e.audit?.assets_available,0)}</strong></div><div class="metric"><span>Source asset</span><strong>${esc(e.source_asset)}</strong></div><div class="metric"><span>Target regime</span><strong>${esc(e.problem_regime)}</strong></div></div></section>${(e.rules||[]).map((q,i)=>`<section class="card ${i===0?'winner':''}"><h2>${i+1}. ${esc(q.candidate_id)} — ${esc(q.name)}</h2><p>${esc(q.hypothesis)}</p><p class="${q.degraded_assets?'bad':q.improved_assets>=2?'ok':'warn'}"><strong>${esc(q.verdict)}</strong></p><div class="grid"><div class="metric"><span>Improved assets</span><strong>${f(q.improved_assets,0)}</strong></div><div class="metric"><span>Neutral assets</span><strong>${f(q.neutral_assets,0)}</strong></div><div class="metric"><span>Degraded assets</span><strong>${f(q.degraded_assets,0)}</strong></div><div class="metric"><span>Evidence score</span><strong>${f(q.confidence_score)}</strong></div></div>${(q.asset_results||[]).map(asset).join('')}</section>`).join('')||'<section class="card">No qualified rules were available for cross-asset testing.</section>'}<section class="card"><h2>Safeguards</h2><ul>${(e.safeguards||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="notice">${esc(e.note)}</p></section>`}load().catch(e=>document.getElementById('content').innerHTML=`<section class="card"><h2>Could not load evidence</h2><p>${esc(e.message)}</p></section>`);</script></main><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script><script src="workspace.js?v=37.0.0"></script><script src="design-system.js?v=37.0.0"></script></body></html>
