<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forward Validation</title><style>
:root{--bg:#061221;--card:#122238;--line:#29425e;--text:#f4f7fc;--muted:#aab9ce;--ok:#64e0ba;--warn:#ffd264;--bad:#ff8298;--purple:#68438e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}main{max-width:940px;margin:auto;padding:32px}h1{font-size:48px;margin:0 0 16px}.sub{color:var(--muted);font-size:20px;line-height:1.5}.nav{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}.nav a{color:var(--text);text-decoration:none;border:2px solid var(--line);border-radius:30px;padding:12px 22px;font-weight:700}.nav a.active{background:#eef5ff;color:#102036}.card{background:var(--card);border:2px solid var(--line);border-radius:36px;padding:38px;margin:28px 0}.hero{border-color:var(--ok)}.badge{display:inline-block;padding:12px 22px;border-radius:30px;background:var(--purple);font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.metric{border:2px solid var(--line);border-radius:25px;padding:22px}.metric span{display:block;color:var(--muted);font-size:16px}.metric strong{display:block;font-size:27px;margin-top:5px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.checks{list-style:none;padding:0}.checks li{padding:15px 0;border-bottom:2px solid var(--line);display:flex;justify-content:space-between}.note{background:#493914;border:2px solid #8c6b1d;border-radius:24px;padding:24px;color:#ffe599;line-height:1.5}@media(max-width:650px){main{padding:30px}h1{font-size:42px}.grid{grid-template-columns:1fr 1fr}.card{padding:38px}}
</style><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"><link rel="stylesheet" href="workspace.css?v=41.1.0"><link rel="stylesheet" href="design-system.css?v=41.1.0"></head><body><main><h1>Forward Validation Manager</h1><p class="sub">Frozen candidates versus unchanged baselines on genuinely post-freeze candles.</p><div id="app"><section class="card">Loading…</section></div><script>
const f=(n,d=2)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
fetch('strategies.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(data=>{const v=data.forward_validation||{},rows=v.candidates||[];document.getElementById('app').innerHTML=`<section class="card"><span class="badge" title="Forward-validation engine ${e(v.version||'legacy')}">V41.1.0</span><h2>${rows.length} frozen candidate${rows.length===1?'':'s'}</h2><p class="sub">Passing these gates permits a manual paper-trading review only.</p></section>`+rows.map(x=>{const b=x.baseline_metrics||{},c=x.candidate_metrics||{},q=x.comparison||{};return `<section class="card hero"><h2>${e(x.candidate_id)} · ${e(x.status)}</h2><p class="sub">${e(x.human_rule)}</p><div class="grid"><div class="metric"><span>Forward days</span><strong>${f(x.forward_days,1)}</strong></div><div class="metric"><span>Forward candles</span><strong>${f(x.forward_candles,0)}</strong></div><div class="metric"><span>Baseline P&amp;L</span><strong>$${f(b.net_pnl)}</strong></div><div class="metric"><span>Candidate P&amp;L</span><strong>$${f(c.net_pnl)}</strong></div><div class="metric"><span>P&amp;L advantage</span><strong>$${f(q.net_pnl_change)}</strong></div><div class="metric"><span>Duration reduction</span><strong>${f((q.duration_reduction_hours||0)/24,1)}d</strong></div><div class="metric"><span>Candidate drawdown</span><strong>${f(c.maximum_drawdown_pct_of_capital,1)}%</strong></div><div class="metric"><span>Candidate deals</span><strong>${f(c.closed_deals,0)}</strong></div></div><ul class="checks">${Object.entries(x.checks||{}).map(([k,val])=>`<li><span>${e(k.replaceAll('_',' '))}</span><strong class="${val?'ok':'warn'}">${val?'PASS':'NOT YET'}</strong></li>`).join('')}</ul></section>`}).join('')+`<section class="card"><div class="note">No candidate can change production, DCA settings or live execution from this page.</div></section>`}).catch(err=>document.getElementById('app').innerHTML=`<section class="card"><h2>Error</h2><p>${e(err.message)}</p></section>`)
</script></main><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script><script src="workspace.js?v=41.1.0"></script><script src="design-system.js?v=41.1.0"></script></body></html>
