<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Candidate Registry</title><style>:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--purple:#9b72cf}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:1100px;margin:auto;padding:22px 16px 60px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-weight:750;font-size:13px}.nav a.active{background:#eef5ff;color:#091626}.card{border:1px solid var(--line);background:rgba(16,29,48,.96);border-radius:24px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#091626;border:1px solid var(--line);border-radius:16px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:18px}.muted{color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}.pill{display:inline-block;background:#68418b;border-radius:999px;padding:9px 14px;font-weight:800}.notice{background:#372d16;border:1px solid #78622b;color:#ffe29a;border-radius:14px;padding:14px}.life{display:flex;gap:7px;flex-wrap:wrap}.stage{border:1px solid var(--line);border-radius:999px;padding:7px 9px;color:var(--muted);font-size:12px}.stage.done{border-color:var(--ok);color:var(--ok)}.stage.current{background:var(--ok);color:#07111f;font-weight:800}.selected{border:2px solid var(--ok)}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}</style><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"><link rel="stylesheet" href="workspace.css?v=41.2.0"><link rel="stylesheet" href="design-system.css?v=41.2.0"></head><body><main><h1>Candidate Intelligence</h1><p class="muted">Permanent, immutable records for research winners before forward testing and bot decisions.</p><div id="content"><section class="card">Loading…</section></div><script>const e=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const f=(n,d=1)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';fetch('strategies.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{const a=d.candidate_intelligence;if(!a)throw Error('Run the V14 workflow.');let h=`<section class="card"><span class="pill">IMMUTABLE REGISTRY</span><h2>Candidate knowledge base</h2><div class="grid"><div class="metric"><span>Candidates</span><strong>${f(a.candidate_count,0)}</strong></div><div class="metric"><span>Engine</span><strong>V${e(a.version)}</strong></div><div class="metric"><span>Stage changes</span><strong>MANUAL</strong></div><div class="metric"><span>Live execution</span><strong class="bad">NO</strong></div></div><p class="notice">${e(a.note)}</p></section>`;h+=(a.candidates||[]).map(c=>`<section class="card selected"><h2>${e(c.candidate_id)} — ${e(c.asset_id)} ${e(c.regime)}</h2><p class="ok"><strong>${e(c.status)}</strong></p><p>${e(c.human_rule)}</p><div class="grid"><div class="metric"><span>Frozen</span><strong>${e(String(c.frozen_at||'').slice(0,10))}</strong></div><div class="metric"><span>Forward start</span><strong>${e(String(c.forward_test_start||'').slice(0,16).replace('T',' '))}</strong></div><div class="metric"><span>Diagnostic confidence</span><strong>${f(c.diagnostic_confidence_pct)}%</strong></div><div class="metric"><span>Fingerprint</span><strong>${e(c.fingerprint)}</strong></div></div><h3>Lifecycle</h3><div class="life">${(c.lifecycle||[]).map(x=>`<span class="stage ${x.current?'current':x.complete?'done':''}">${e(x.stage)}</span>`).join('')}</div><p class="muted">DCA: ${e(c.dca_settings_status)} · Production effect: ${e(c.production_effect)}</p></section>`).join('');const g=a.evidence_graph||{};h+=`<section class="card"><h2>Evidence graph — ${e(g.family)}</h2>${(g.nodes||[]).map(n=>`<div class="metric" style="margin:8px 0"><strong>${e(n.title)}</strong> · <span class="${n.status==='PASS'?'ok':'bad'}">${e(n.status)}</span> · score ${f(n.score,2)} ${n.selected?'· SELECTED':''}</div>`).join('')}</section>`;h+=`<section class="card"><h2>Safeguards</h2><ul>${(a.principles||[]).map(x=>`<li>${e(x)}</li>`).join('')}</ul></section>`;document.getElementById('content').innerHTML=h}).catch(x=>document.getElementById('content').innerHTML=`<section class="card"><h2>Could not load</h2><p>${e(x.message)}</p></section>`)</script></main><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script><script src="workspace.js?v=41.2.0"></script><script src="design-system.js?v=41.2.0"></script></body></html>
