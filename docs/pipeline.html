<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Automatic Research Pipeline</title><style>:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--purple:#b193e0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:1100px;margin:auto;padding:22px 16px 60px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-weight:750;font-size:13px}.nav a.active{background:#eef5ff;color:#091626}.card{border:1px solid var(--line);background:rgba(16,29,48,.96);border-radius:24px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric,.item{background:#091626;border:1px solid var(--line);border-radius:16px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:18px}.muted{color:var(--muted)}.badge{display:inline-block;background:#563b78;padding:8px 12px;border-radius:999px;font-weight:800}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.notice{background:#372d16;border:1px solid #78622b;color:#ffe29a;border-radius:14px;padding:14px}.winner{border:2px solid var(--ok)}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><main><h1>Automatic Research Pipeline</h1><p class="muted">Runs the queued diagnostic experiments automatically and ranks what the engine learns.</p><nav class="nav"><a href="index.html">Dashboard</a><a href="intelligence.html">Trading Intelligence</a><a href="health.html">Strategy Health</a><a href="settings.html">Settings</a><a href="research.html">Research</a><a href="evolution.html">Evolution</a><a href="evidence.html">Evidence</a><a href="dna.html">Asset DNA</a><a href="traits.html">Traits</a><a class="active" href="pipeline.html">Pipeline</a><a href="autonomy.html">Autonomy</a></nav><div id="content"><section class="card">Loading automatic experiments…</section></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const f=(n,d=1)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';async function load(){const r=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'}),d=await r.json(),a=d.automatic_research;if(!a)throw new Error('Automatic research is unavailable. Run the main workflow.');document.getElementById('content').innerHTML=`<section class="card"><span class="badge">AUTOMATIC DIAGNOSTICS</span><h2>${esc(a.source_asset)} · ${esc(a.target_regime)} regime</h2><div class="grid"><div class="metric"><span>Experiments run</span><strong>${f(a.audit?.experiments_run,0)}</strong></div><div class="metric"><span>Passed</span><strong>${f(a.audit?.passed,0)}</strong></div><div class="metric"><span>Rejected</span><strong>${f(a.audit?.rejected,0)}</strong></div><div class="metric"><span>Engine</span><strong>V${esc(a.version)}</strong></div></div><p class="notice">${esc(a.execution_policy)} ${esc(a.promotion_policy)}</p></section>${(a.experiments||[]).map((x,i)=>`<section class="card ${i===0?'winner':''}"><h2>#${x.rank} ${esc(x.title)} <span class="${x.status==='PASS'?'ok':'bad'}">${esc(x.status)}</span></h2><p>${esc(x.description)}</p><p class="muted">Only amended variable: ${esc(x.amendment?.human_rule)}</p><div class="grid"><div class="metric"><span>Net P&L</span><strong>$${f(x.metrics?.net_pnl,2)}</strong></div><div class="metric"><span>P&L change</span><strong>$${f(x.comparison?.net_pnl_change,2)}</strong></div><div class="metric"><span>Duration reduction</span><strong>${f((x.comparison?.duration_reduction_hours||0)/24)}d</strong></div><div class="metric"><span>Drawdown change</span><strong>${f(x.comparison?.drawdown_change_pp)}pp</strong></div><div class="metric"><span>Deal change</span><strong>${f(x.comparison?.deal_count_change,0)}</strong></div><div class="metric"><span>Problem trade changed</span><strong>${x.comparison?.problem_trade_changed?'YES':'NO'}</strong></div><div class="metric"><span>Research score</span><strong>${f(x.score,2)}</strong></div><div class="metric"><span>Family</span><strong>${esc(x.family)}</strong></div></div></section>`).join('')}<section class="card"><h2>Family coverage</h2>${(a.family_summary||[]).map(x=>`<div class="item"><strong>${esc(x.family)}</strong><p>${f(x.passed,0)} of ${f(x.tested,0)} passed · best: ${esc(x.best_experiment)}</p></div>`).join('')}</section><section class="card"><h2>Safeguard</h2><p class="notice">${esc(a.note)}</p></section>`}load().catch(e=>document.getElementById('content').innerHTML=`<section class="card"><h2>Could not load pipeline</h2><p>${esc(e.message)}</p></section>`);</script></main></body></html>
