<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Queue</title><link rel="stylesheet" href="v20.css"><style>
body{padding-bottom:80px}.rq{max-width:980px;margin:auto;padding:28px 18px}.hero,.card{background:#122238;border:2px solid #29425e;border-radius:28px;padding:24px;margin:18px 0}.hero{border-color:#7656a8}.pill{display:inline-block;border-radius:999px;padding:8px 13px;background:#67428d;font-weight:800}.asset-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.score{font-size:34px;font-weight:900}.muted{color:#aab9ce}.pass{color:#64e0ba}.reject{color:#ff8298}.warning{color:#ffd264}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.metric{border:1px solid #36516e;border-radius:18px;padding:15px}.metric b{display:block;font-size:22px;margin-top:5px}details{border-top:1px solid #36516e;padding-top:14px;margin-top:14px}summary{cursor:pointer;font-weight:800}.experiment{border:1px solid #36516e;border-radius:18px;padding:16px;margin:12px 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav a{color:#eef5ff;text-decoration:none;border:1px solid #36516e;border-radius:999px;padding:9px 14px}@media(max-width:560px){.metrics{grid-template-columns:1fr}.rq{padding:20px 13px}.hero,.card{padding:20px;border-radius:23px}}
</style></head><body><main class="rq"><h1>Automatic Research Queue</h1><p class="muted">The engine identifies weak strategies and runs one-variable diagnostics. All outcomes remain advisory.</p><nav class="nav"><a href="index.html">Dashboard</a><a href="cockpit.html">Cockpit</a><a href="research.html">Research</a><a href="research_queue.html">Queue</a><a href="data.html">Data</a><a href="more.html">More</a></nav><div id="app"><section class="hero">Loading queue…</section></div></main><script>
const e=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const n=(v,d=1)=>Number(v||0).toFixed(d);
fetch('strategies.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(data=>{const q=data.research_queue||{};const rows=q.queue||[];let html=`<section class="hero"><span class="pill">ADVISORY ONLY</span><h2>${e(q.status||'WAITING')}</h2><div class="metrics"><div class="metric">Assets reviewed<b>${e(q.summary?.assets_reviewed||0)}</b></div><div class="metric">Experiments run<b>${e(q.summary?.experiments_run||0)}</b></div><div class="metric">Candidate assets<b>${e(q.summary?.assets_with_candidate||0)}</b></div><div class="metric">Live changes<b class="reject">DISABLED</b></div></div><p class="muted">${e(q.note||'')}</p></section>`;
html+=rows.map(row=>{const w=row.recommended_experiment;return `<section class="card"><div class="asset-head"><div><span class="pill">Priority ${e(row.priority)}</span><h2>${e(row.asset_id)} · ${e(row.target_regime)}</h2><p class="muted">${e((row.weakness_reasons||[]).join(' · '))}</p></div><div><div class="muted">Weakness score</div><div class="score">${n(row.weakness_score)}</div></div></div><h3 class="${w?'pass':'warning'}">${e(row.status)}</h3>${w?`<div class="experiment"><strong>${e(w.title)}</strong><p>${e(w.human_rule)}</p><div class="metrics"><div class="metric">Rank score<b>${n(w.rank_score)}</b></div><div class="metric">P&L change<b class="${w.comparison.net_pnl_change>=0?'pass':'reject'}">$${n(w.comparison.net_pnl_change,2)}</b></div><div class="metric">Duration reduction<b>${n(w.comparison.duration_reduction_hours/24,1)} days</b></div><div class="metric">Deal retention<b>${n(w.comparison.deal_retention_pct,1)}%</b></div></div></div>`:''}<p class="muted"><strong>Next action:</strong> ${e(row.next_action)}</p><details><summary>View all ${row.experiments?.length||0} experiments</summary>${(row.experiments||[]).map(x=>`<div class="experiment"><strong>${e(x.title)}</strong> · <span class="${x.status==='PASS'?'pass':'reject'}">${e(x.status)}</span><p class="muted">${e(x.human_rule)}</p><div>Score ${n(x.rank_score)} · P&L $${n(x.comparison.net_pnl_change,2)} · DD ${n(x.comparison.drawdown_change_pp,2)} pp</div></div>`).join('')}</details></section>`}).join('');document.getElementById('app').innerHTML=html;}).catch(err=>document.getElementById('app').innerHTML=`<section class="hero"><h2>Error</h2><p>${e(err.message)}</p></section>`);
</script></body></html>
