<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="stylesheet" href="v20.css"><title>Decision Explainability</title><style>:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--blue:#6db7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:960px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 16px 50px}h1{font-size:38px;margin:10px 0}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:25px;padding:22px;margin:16px 0}.metric{background:#091626;border:1px solid var(--line);border-radius:16px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}a{color:#9fd0ff}.version{background:#25405e;padding:9px 13px;border-radius:99px;font-weight:800}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}</style><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"><link rel="stylesheet" href="workspace.css?v=67.0.0"><link rel="stylesheet" href="design-system.css?v=67.0.0"></head><body><main><div class="head"><div><h1>Decision Explainability</h1><p class="muted">Transparent scoring, blockers and the next manual action for every asset.</p></div><span class="version">V67.0.0</span></div><div id="content"><section class="panel">Loading…</section></div><script>
async function run(){const d=await (await fetch('strategies.json?t='+Date.now(),{cache:'no-store'})).json();document.getElementById('content').innerHTML=d.assets.map(a=>{const i=a.intelligence||{},l=a.latest||{},h=a.health||{};let factors=[];(i.explanation||[]).forEach((x,k)=>factors.push({t:x,v:k===0?'+20':k===1?'+15':'+10',c:'positive'}));if(!l.entry_allowed)factors.push({t:l.entry_reason||'Entry blocked',v:'BLOCK',c:'negative'});if((h.score||0)<70)factors.push({t:'Health review penalty',v:'-'+Math.max(1,Math.round((70-(h.score||0))/3)),c:'negative'});if(a.open_position)factors.push({t:'Unresolved replay position',v:'CAUTION',c:'neutral'});return `<section class="panel"><h2>${esc(a.symbol)} · ${esc(l.regime||'—')}</h2><p class="muted">Decision: <strong>${esc(a.production_status==='production'?(l.entry_allowed?'ENTRY FILTERS PASS':'ENTRY BLOCKED'):'RESEARCH ONLY')}</strong></p><div class="metric"><span>Opportunity score</span><strong style="font-size:34px">${fmt(i.opportunity_score,0)}/100</strong></div><h3>Why</h3>${factors.map(f=>`<div class="factor"><span>${esc(f.t)}</span><strong class="${f.c}">${esc(f.v)}</strong></div>`).join('')}<p><strong>Next manual action:</strong> ${esc(a.production_status==='production'?(l.entry_allowed?'Review health and open-position risk before acting.':l.entry_reason||'Wait.'):'Continue independent forward evidence; do not alter live bots.')}</p></section>`}).join('')}
run().catch(e=>document.getElementById('content').innerHTML='<section class="panel">'+esc(e.message)+'</section>');
</script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=(n,d=1)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';</script></main><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script><script src="workspace.js?v=67.0.0"></script><script src="design-system.js?v=67.0.0"></script></body></html>
