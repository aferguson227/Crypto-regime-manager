<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Asset DNA</title><style>:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--purple:#b193e0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:1100px;margin:auto;padding:22px 16px 60px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-weight:750;font-size:13px}.nav a.active{background:#eef5ff;color:#091626}.card{border:1px solid var(--line);background:rgba(16,29,48,.96);border-radius:24px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric,.item{background:#091626;border:1px solid var(--line);border-radius:16px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:18px}.muted{color:var(--muted)}.badge{display:inline-block;background:#563b78;padding:8px 12px;border-radius:999px;font-weight:800}.ok,.STRONG\ POSITIVE,.POSITIVE{color:var(--ok)}.bad,.HARMFUL,.NEGATIVE{color:var(--bad)}.warn,.NEUTRAL{color:var(--warn)}.notice{background:#372d16;border:1px solid #78622b;color:#ffe29a;border-radius:14px;padding:14px}.rule{margin-top:10px}.score{font-size:28px;font-weight:850}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}</style><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"><link rel="stylesheet" href="workspace.css?v=53.0.0"><link rel="stylesheet" href="design-system.css?v=53.0.0"></head><body><main><h1>Asset DNA Library</h1><p class="muted">Learns which research rules help, hurt, or have no effect for each asset.</p><div id="content"><section class="card">Loading asset profiles…</section></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const f=(n,d=1)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';const money=n=>`${Number(n)<0?'−':''}$${f(Math.abs(Number(n)||0),2)}`;function rule(r){const x=r.comparison||{};return `<div class="item rule"><h3>${esc(r.candidate_id)} — ${esc(r.name)}</h3><p class="${esc(r.effect)}"><strong>${esc(r.effect)}</strong> · DNA score ${f(r.dna_score,2)}</p><p>${esc(r.hypothesis)}</p><div class="grid"><div class="metric"><span>P&L change</span><strong>${money(x.net_pnl_change)}</strong></div><div class="metric"><span>Duration reduction</span><strong>${f((x.duration_reduction_hours||0)/24)}d</strong></div><div class="metric"><span>Drawdown change</span><strong>${f(x.drawdown_change_pp)}pp</strong></div><div class="metric"><span>Deal-count change</span><strong>${Number(x.deal_count_change||0)>0?'+':''}${f(x.deal_count_change,0)}</strong></div></div></div>`}async function load(){const r=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'}),d=await r.json(),a=d.asset_dna;if(!a)throw new Error('Asset DNA is not available. Run the main workflow.');document.getElementById('content').innerHTML=`<section class="card"><span class="badge">RESEARCH ONLY</span><h2>Asset-specific evidence profiles</h2><div class="grid"><div class="metric"><span>Assets profiled</span><strong>${f(a.audit?.assets_profiled,0)}</strong></div><div class="metric"><span>Distinct rules</span><strong>${f(a.audit?.distinct_rules,0)}</strong></div><div class="metric"><span>Engine version</span><strong>V${esc(a.version)}</strong></div><div class="metric"><span>Source</span><strong>Evidence Library</strong></div></div></section>${(a.profiles||[]).map(p=>`<section class="card"><h2>${esc(p.asset_id)} — ${esc(p.profile_label)}</h2><div class="grid"><div class="metric"><span>Confidence</span><strong>${esc(p.confidence)}</strong></div><div class="metric"><span>Rules tested</span><strong>${f(p.rules_tested,0)}</strong></div><div class="metric"><span>Positive rules</span><strong>${f(p.positive_rules,0)}</strong></div><div class="metric"><span>Negative rules</span><strong>${f(p.negative_rules,0)}</strong></div><div class="metric"><span>Average DNA score</span><strong class="score">${f(p.average_dna_score,2)}</strong></div></div>${(p.rule_effects||[]).map(rule).join('')||'<p class="muted">No rule evidence yet.</p>'}</section>`).join('')}<section class="card"><h2>Asset response similarity</h2>${(a.similarities||[]).map(s=>`<div class="item"><h3>${esc(s.asset_a)} ↔ ${esc(s.asset_b)}</h3><p><strong>${esc(s.label)}</strong></p><div class="grid"><div class="metric"><span>Similarity</span><strong>${f(s.similarity_score)}%</strong></div><div class="metric"><span>Rules compared</span><strong>${f(s.rules_compared,0)}</strong></div></div></div>`).join('')||'<p class="muted">More rule evidence is needed.</p>'}</section><section class="card"><h2>Safeguards</h2><ul>${(a.safeguards||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="notice">${esc(a.note)}</p></section>`}load().catch(e=>document.getElementById('content').innerHTML=`<section class="card"><h2>Could not load Asset DNA</h2><p>${esc(e.message)}</p></section>`);</script></main><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script><script src="workspace.js?v=53.0.0"></script><script src="design-system.js?v=53.0.0"></script></body></html>
