<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V18 Unified Workspace</title><style>:root{--bg:#07111f;--card:#112139;--inner:#081827;--border:#294563;--text:#f4f7fc;--muted:#aab9ce;--green:#65e0b8;--amber:#ffd35f;--red:#ff7b8e;--blue:#9fd0ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:920px;margin:auto;padding:36px 30px 80px}.header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.header h1{font-size:clamp(42px,8vw,66px);line-height:1.05;margin:30px 0 14px}.sub,.muted{color:var(--muted)}.sub{font-size:22px;line-height:1.45}.version,.pill{display:inline-block;border-radius:999px;padding:14px 24px;font-weight:800;background:#294e75}.nav{display:flex;flex-wrap:wrap;gap:12px;margin:32px 0}.nav a{border:2px solid var(--border);border-radius:999px;padding:13px 24px;color:var(--text);text-decoration:none;font-weight:800}.nav a.active{background:#eef5ff;color:#0b1726}.card{background:var(--card);border:2px solid var(--border);border-radius:36px;padding:38px;margin:28px 0}.card h2{font-size:38px;margin:10px 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.metric,.item{background:var(--inner);border:2px solid var(--border);border-radius:28px;padding:25px}.metric span{display:block;color:var(--muted);font-size:18px}.metric strong{display:block;font-size:34px;margin-top:8px}.action{border-left:9px solid var(--amber);background:#3a3014;border-radius:24px;padding:22px;margin:14px 0}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}details{background:var(--inner);border:2px solid var(--border);border-radius:26px;padding:20px;margin:14px 0}summary{font-weight:800;font-size:22px;cursor:pointer}.assethead{display:flex;justify-content:space-between;gap:12px;align-items:center}.assethead h3{font-size:30px;margin:0}.badge{border-radius:999px;padding:9px 15px;font-weight:800;background:#294e75}.footer{text-align:center;color:var(--muted);margin-top:30px}@media(max-width:650px){main{padding:25px 22px 70px}.grid{grid-template-columns:1fr 1fr}.card{padding:27px 22px;border-radius:30px}.header{display:block}.version{float:right}.nav a{padding:11px 17px}.metric strong{font-size:28px}}</style><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"><link rel="stylesheet" href="workspace.css?v=37.1.0"><link rel="stylesheet" href="design-system.css?v=37.1.0"></head><body><main><div class="header"><div><h1>Unified Workspace</h1><p class="sub">Production, research and validation in one read-only operating screen.</p></div><span class="version">V32.2.0</span></div><nav class="v20-nav"><a href="index.html">Dashboard</a><a href="cockpit.html">Cockpit</a><a href="research.html">Research</a><a href="discovery.html">Discovery</a><a href="data.html">Data</a><a class="active" href="more.html">More</a></nav><div class="v20-tools"><a href="explainability.html">Why this decision</a><a href="timeline.html">Timeline</a><a href="integrity.html">Data integrity</a></div><div id="root"><section class="card">Loading workspace…</section></div><p class="footer">No control on this page can change a live bot.</p></main><script>
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const f=(n,d=0)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';
async function load(){const r=document.getElementById('root');try{const x=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'});if(!x.ok)throw Error('HTTP '+x.status);const d=await x.json(),op=d.operational_intelligence||{},assets=op.assets||[],alerts=op.alerts||[],fv=(d.forward_validation||{}).candidates||[];r.innerHTML=`<section class="card"><span class="pill">ACTION CENTRE</span><h2>${alerts.length?alerts.length+' items need review':'No urgent actions'}</h2>${alerts.length?alerts.map(a=>`<div class="action"><strong>${e(a.asset_id)} · ${e(a.level)}</strong><div>${e(a.message)}</div></div>`).join(''):'<p class="good">All current guardrails are operating normally.</p>'}</section><section class="card"><h2>Asset workspace</h2>${assets.map(a=>{const v=fv.find(x=>x.asset_id===a.asset_id);return `<details open><summary>${e(a.symbol)} · ${e(a.production_status)} · ${e(a.regime)}</summary><div class="grid" style="margin-top:18px"><div class="metric"><span>Decision</span><strong>${e(a.production_status==='RESEARCH'?'RESEARCH ONLY':a.entry_allowed?'PASS':'BLOCK')}</strong></div><div class="metric"><span>Opportunity</span><strong>${f(a.opportunity_score)}/100</strong></div><div class="metric"><span>Health</span><strong>${f(a.health_score)}/100</strong></div><div class="metric"><span>Validation</span><strong style="font-size:22px">${e(a.validation_state||'PRODUCTION BASELINE')}</strong></div></div><div class="action"><strong>Next action</strong><div>${e(a.next_action)}</div></div>${v?`<p class="muted">Forward evidence: ${f(v.forward_days,1)} days · ${f(v.forward_candles)} candles · ${f(v.candidate_metrics&&v.candidate_metrics.closed_deals)} deals.</p>`:''}</details>`}).join('')}</section><section class="card"><h2>Quick links</h2><div class="grid"><a class="item" href="candidates.html" style="color:var(--text)"><strong>Candidates</strong><p class="muted">Immutable research winners.</p></a><a class="item" href="validation.html" style="color:var(--text)"><strong>Validation</strong><p class="muted">Independent post-freeze evidence.</p></a><a class="item" href="intelligence.html" style="color:var(--text)"><strong>Intelligence</strong><p class="muted">Rankings and explanations.</p></a><a class="item" href="health.html" style="color:var(--text)"><strong>Health</strong><p class="muted">Detailed strategy behaviour.</p></a></div></section>`}catch(err){r.innerHTML=`<section class="card"><h2>Workspace unavailable</h2><p>${e(err.message)}</p></section>`}}load();
</script><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script><script src="workspace.js?v=37.1.0"></script><script src="design-system.js?v=37.1.0"></script></body></html>
