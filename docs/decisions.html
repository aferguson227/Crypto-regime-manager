<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advisory Decisions</title><style>
:root{--bg:#061221;--card:#122238;--line:#29425e;--text:#f4f7fc;--muted:#aab9ce;--ok:#64e0ba;--warn:#ffd264;--bad:#ff8298;--purple:#68438e}*{box-sizing:border-box;min-width:0}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}main{width:100%;max-width:940px;margin:auto;padding:32px}h1{font-size:48px;line-height:1.05;margin:0 0 16px;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:20px;line-height:1.5;overflow-wrap:anywhere}.nav{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}.nav a{color:var(--text);text-decoration:none;border:2px solid var(--line);border-radius:30px;padding:12px 22px;font-weight:700}.nav a.active{background:#eef5ff;color:#102036}.card{background:var(--card);border:2px solid var(--line);border-radius:36px;padding:38px;margin:28px 0;overflow:hidden}.hero{border-color:var(--ok)}.badge{display:inline-block;padding:12px 22px;border-radius:30px;background:var(--purple);font-weight:800}.summary{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.pill{border:2px solid var(--line);border-radius:999px;padding:10px 15px;font-weight:700}.decision-list{display:grid;gap:0;border:2px solid var(--line);border-radius:25px;overflow:hidden;margin:22px 0}.decision-row{display:grid;grid-template-columns:minmax(130px,.8fr) minmax(0,1.2fr);gap:20px;align-items:start;padding:20px 22px;border-bottom:2px solid var(--line)}.decision-row:last-child{border-bottom:0}.label{color:var(--muted);font-size:16px;line-height:1.35}.value{font-size:22px;font-weight:800;line-height:1.25;overflow-wrap:anywhere;word-break:break-word}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.neutral{color:var(--muted)}.note{background:#493914;border:2px solid #8c6b1d;border-radius:24px;padding:24px;color:#ffe599;line-height:1.5;overflow-wrap:anywhere}
@media(max-width:650px){main{padding:24px 18px}h1{font-size:42px}.sub{font-size:18px}.card{padding:28px 22px;border-radius:28px}.nav a{padding:11px 18px}.decision-row{grid-template-columns:1fr;gap:7px;padding:18px}.value{font-size:21px}.badge{padding:11px 18px}}
@media(max-width:390px){main{padding:20px 14px}h1{font-size:38px}.card{padding:24px 18px}.value{font-size:19px}}
</style><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"><link rel="stylesheet" href="workspace.css?v=64.0.0"><link rel="stylesheet" href="design-system.css?v=64.0.0"></head><body><main><h1>Advisory Decision Preview</h1><p class="sub">Shows how validated candidates could influence entries, without controlling any bot.</p><div id="app"><section class="card">Loading…</section></div><script>
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const stateClass=s=>s==='PASS'?'ok':s==='BLOCK'?'bad':'neutral';
fetch('strategies.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(data=>{const d=data.advisory_decisions||{},rows=d.decisions||[];document.getElementById('app').innerHTML=`<section class="card"><span class="badge">ADVISORY ONLY</span><h2>${rows.length} candidate decision preview${rows.length===1?'':'s'}</h2><p class="sub">Live execution authorised: <strong class="bad">NO</strong></p></section>`+rows.map(x=>{const state=x.candidate_rule_state||(x.candidate_rule_passes_now?'PASS':'BLOCK');return `<section class="card ${x.paper_trading_review_eligible?'hero':''}"><h2>${e(x.candidate_id)} · ${e(x.action)}</h2><div class="summary"><span class="pill">Current: ${e(x.regime)}</span><span class="pill">Target: ${e(x.target_regime||'—')}</span></div><div class="decision-list"><div class="decision-row"><div class="label">Candidate rule now</div><div class="value ${stateClass(state)}">${e(state)}</div></div><div class="decision-row"><div class="label">Forward status</div><div class="value">${e(x.forward_validation_status)}</div></div><div class="decision-row"><div class="label">Paper review eligible</div><div class="value">${x.paper_trading_review_eligible?'YES':'NO'}</div></div><div class="decision-row"><div class="label">Recommended bot for current regime</div><div class="value">${e(x.recommended_bot||'None')}</div></div><div class="decision-row"><div class="label">DCA settings</div><div class="value">${e(x.dca_settings_status)}</div></div><div class="decision-row"><div class="label">Exit policy</div><div class="value">${e(x.exit_policy||'UNCHANGED')}</div></div></div><p class="sub">${e(x.reason)}</p></section>`}).join('')+`<section class="card"><div class="note">This preview cannot open, close, pause or modify a live 3Commas bot.</div></section>`}).catch(err=>document.getElementById('app').innerHTML=`<section class="card"><h2>Error</h2><p>${e(err.message)}</p></section>`)
</script></main><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script><script src="workspace.js?v=64.0.0"></script><script src="design-system.js?v=64.0.0"></script></body></html>
