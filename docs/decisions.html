<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advisory Decisions</title><style>
:root{--bg:#061221;--card:#122238;--line:#29425e;--text:#f4f7fc;--muted:#aab9ce;--ok:#64e0ba;--warn:#ffd264;--bad:#ff8298;--purple:#68438e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}main{max-width:940px;margin:auto;padding:32px}h1{font-size:48px;margin:0 0 16px}.sub{color:var(--muted);font-size:20px;line-height:1.5}.nav{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}.nav a{color:var(--text);text-decoration:none;border:2px solid var(--line);border-radius:30px;padding:12px 22px;font-weight:700}.nav a.active{background:#eef5ff;color:#102036}.card{background:var(--card);border:2px solid var(--line);border-radius:36px;padding:38px;margin:28px 0}.hero{border-color:var(--ok)}.badge{display:inline-block;padding:12px 22px;border-radius:30px;background:var(--purple);font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.metric{border:2px solid var(--line);border-radius:25px;padding:22px}.metric span{display:block;color:var(--muted);font-size:16px}.metric strong{display:block;font-size:27px;margin-top:5px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.checks{list-style:none;padding:0}.checks li{padding:15px 0;border-bottom:2px solid var(--line);display:flex;justify-content:space-between}.note{background:#493914;border:2px solid #8c6b1d;border-radius:24px;padding:24px;color:#ffe599;line-height:1.5}@media(max-width:650px){main{padding:30px}h1{font-size:42px}.grid{grid-template-columns:1fr 1fr}.card{padding:38px}}
</style></head><body><main><h1>Advisory Decision Preview</h1><p class="sub">Shows how validated candidates could influence entries, without controlling any bot.</p><nav class="nav"><a href="index.html">Dashboard</a><a href="candidates.html">Candidates</a><a href="validation.html">Validation</a><a class="active" href="decisions.html">Decisions</a></nav><div id="app"><section class="card">Loading…</section></div><script>
const f=(n,d=2)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
fetch('strategies.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(data=>{const d=data.advisory_decisions||{},rows=d.decisions||[];document.getElementById('app').innerHTML=`<section class="card"><span class="badge">ADVISORY ONLY</span><h2>${rows.length} candidate decision preview${rows.length===1?'':'s'}</h2><p class="sub">Live execution authorised: <strong class="bad">NO</strong></p></section>`+rows.map(x=>`<section class="card ${x.paper_trading_review_eligible?'hero':''}"><h2>${e(x.candidate_id)} · ${e(x.action)}</h2><div class="grid"><div class="metric"><span>Current regime</span><strong>${e(x.regime)}</strong></div><div class="metric"><span>Candidate rule now</span><strong class="${x.candidate_rule_passes_now?'ok':'warn'}">${x.candidate_rule_passes_now?'PASS':'BLOCK'}</strong></div><div class="metric"><span>Forward status</span><strong>${e(x.forward_validation_status)}</strong></div><div class="metric"><span>Paper review eligible</span><strong>${x.paper_trading_review_eligible?'YES':'NO'}</strong></div><div class="metric"><span>Recommended bot</span><strong>${e(x.recommended_bot||'None')}</strong></div><div class="metric"><span>DCA settings</span><strong>${e(x.dca_settings_status)}</strong></div></div><p class="sub">${e(x.reason)}</p></section>`).join('')+`<section class="card"><div class="note">This preview cannot open, close, pause or modify a live 3Commas bot.</div></section>`}).catch(err=>document.getElementById('app').innerHTML=`<section class="card"><h2>Error</h2><p>${e(err.message)}</p></section>`)
</script></main></body></html>
