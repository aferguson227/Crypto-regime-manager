<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>V16 Decision Cockpit</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--panel2:#0a1727;--line:#29415d;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--blue:#9fd0ff;--purple:#b493e6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:980px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px 54px}.header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}h1{font-size:clamp(34px,8vw,64px);line-height:1.03;margin:10px 0}.sub,.muted{color:var(--muted)}.version,.pill{border-radius:999px;padding:9px 14px;font-weight:850}.version{background:#274767}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:760}.nav a.active{background:#eef5ff;color:#091626}.card{background:rgba(16,29,48,.98);border:1px solid var(--line);border-radius:26px;padding:22px;margin:18px 0}.hero{background:linear-gradient(135deg,#172e4d,#101d30)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:16px}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;font-size:25px;margin-top:7px}.asset-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{font-size:12px;background:#29415d}.positive{background:#14523e;color:var(--ok)}.warning{background:#6a5119;color:var(--warn)}.critical{background:#6d2531;color:#ffd8df}.neutral{background:#29415d}.asset h2{font-size:30px;margin:4px 0}.decision{border:1px solid var(--line);background:#091626;border-radius:18px;padding:17px;margin:16px 0}.decision strong{font-size:22px}.blockers{margin:10px 0 0;padding-left:21px;color:var(--muted);line-height:1.55}.next{border-left:5px solid var(--blue);padding:13px 15px;background:#0a1727;border-radius:10px;margin-top:15px}.alert{border-left:5px solid var(--warn);background:#2e2712;padding:14px;border-radius:12px;margin:9px 0}.alert.CRITICAL{border-color:var(--bad);background:#311821}.guard{background:#322710;border:1px solid #7f6420;color:#ffe49a;border-radius:18px;padding:18px;line-height:1.5}.small{font-size:13px}.footer{text-align:center;color:var(--muted);margin-top:25px}@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.asset-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}}@media(max-width:520px){.card{padding:18px}.asset-head{display:block}.badges{justify-content:flex-start;margin-top:12px}}
</style></head><body><main><div class="header"><div><h1>Decision Cockpit</h1><p class="sub">A single read-only operating view for production, research and validation.</p></div><span class="version" id="version">V16.0.0</span></div><nav class="nav"><a href="index.html">Dashboard</a><a href="intelligence.html">Intelligence</a><a href="candidates.html">Candidates</a><a href="validation.html">Validation</a><a href="decisions.html">Decisions</a><a class="active" href="cockpit.html">Cockpit</a></nav><div id="root"><section class="card">Loading operational intelligence…</section></div><p class="footer">V16 is advisory and read-only. It cannot open, close, pause or modify a live bot.</p></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=(n,d=0)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';
async function load(){const root=document.getElementById('root');try{const r=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json(),op=data.operational_intelligence;if(!op)throw new Error('V16 operational intelligence is not present. Run the V16 workflow.');document.getElementById('version').textContent='V'+esc(data.version||'16.0.0');const s=op.summary||{},g=op.guardrails||{};root.innerHTML=`<section class="card hero"><span class="pill neutral">READ-ONLY INTELLIGENCE</span><h2>Operating summary</h2><div class="grid"><div class="metric"><span>Production assets</span><strong>${fmt(s.production_assets)}</strong></div><div class="metric"><span>Entries allowed</span><strong>${fmt(s.entry_allowed)}</strong></div><div class="metric"><span>Review ready</span><strong>${fmt(s.review_ready)}</strong></div><div class="metric"><span>Critical alerts</span><strong>${fmt(s.critical_alerts)}</strong></div></div><p class="muted small">Generated ${new Date(op.generated_at).toLocaleString()}</p></section>${(op.alerts||[]).length?`<section class="card"><h2>Attention required</h2>${op.alerts.map(a=>`<div class="alert ${esc(a.level)}"><strong>${esc(a.asset_id)} · ${esc(a.level)}</strong><div>${esc(a.message)}</div></div>`).join('')}</section>`:''}${(op.assets||[]).map(a=>`<section class="card asset"><div class="asset-head"><div><div class="muted">${esc(a.symbol)} · ${esc(a.production_status)}</div><h2>${esc(a.regime||'Unavailable')}</h2></div><div class="badges"><span class="pill ${esc(a.severity)}">${esc(a.readiness)}</span><span class="pill neutral">Health ${fmt(a.health_score)}/100</span></div></div><div class="asset-grid"><div><div class="decision"><span class="muted">Current decision</span><strong>${a.entry_allowed?'ENTRY FILTERS PASS':a.production_status==='RESEARCH'?'RESEARCH ONLY':'ENTRY BLOCKED'}</strong><p class="muted">${esc(a.recommended_bot||a.validation_state||'No bot recommendation')}</p></div><div class="next"><strong>Next manual action</strong><div>${esc(a.next_action)}</div></div></div><div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="metric"><span>Opportunity</span><strong>${fmt(a.opportunity_score)}/100</strong></div><div class="metric"><span>Data</span><strong>${a.data_ok?'HEALTHY':'BLOCKED'}</strong></div><div class="metric"><span>New candles</span><strong>${fmt(a.new_candles)}</strong></div><div class="metric"><span>Validation</span><strong style="font-size:16px">${esc(a.validation_state||'—')}</strong></div></div>${(a.blockers||[]).length?`<h3>Blockers / cautions</h3><ul class="blockers">${a.blockers.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">No recorded blockers.</p>'}</div></div></section>`).join('')}<section class="card"><h2>Guardrails</h2><div class="guard"><strong>Live execution authorised: ${g.live_execution_authorised?'YES':'NO'}</strong><br>Automatic bot, DCA and exit changes: disabled. Every action remains subject to manual review and the existing forward-validation lifecycle.</div></section>`}catch(e){root.innerHTML=`<section class="card"><h2>Cockpit unavailable</h2><p>${esc(e.message)}</p></section>`}}load();
</script></body></html>
