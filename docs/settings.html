<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Strategy Settings</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100vh}main{max-width:920px;margin:auto;padding:24px 16px 44px}h1{margin:4px 0}.muted{color:var(--muted)}.nav{display:flex;gap:8px;margin:18px 0}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-size:13px;font-weight:750}.nav a.active{background:#eef5ff;color:#091626}.card{border:1px solid var(--line);background:rgba(16,29,48,.96);border-radius:24px;padding:20px;margin:16px 0}.section{font-size:13px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:18px}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px}td:last-child,th:last-child{text-align:right}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}.error{background:#53202b}
</style><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"><link rel="stylesheet" href="workspace.css?v=37.1.0"><link rel="stylesheet" href="design-system.css?v=37.1.0"></head><body><main><h1>Active Strategy Settings</h1><p class="muted">Read-only view of the settings currently used by the replay engine.</p><nav class="v20-nav settings-nav-fix"><a href="index.html">Dashboard</a><a href="cockpit.html">Cockpit</a><a href="research.html">Research</a><a href="discovery.html">Discovery</a><a href="data.html">Data</a><a class="active" href="more.html">More</a></nav><div class="v20-tools"><a href="explainability.html">Why this decision</a><a href="timeline.html">Timeline</a><a href="integrity.html">Data integrity</a></div><div id="content"><section class="card">Loading settings…</section></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toLocaleString(undefined,{maximumFractionDigits:d}):'—';
function filterRows(f){const rows=[];for(const [reg,vals] of Object.entries(f||{})){for(const [k,v] of Object.entries(vals||{}))rows.push(`<tr><td>${esc(reg)}</td><td>${esc(k)}</td><td>${esc(v)}</td></tr>`)}return rows.join('')||'<tr><td colspan="3">No filters</td></tr>'}
async function load(){const box=document.getElementById('content');try{const r=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();box.innerHTML=data.assets.map(a=>{const c=a.strategy_config||{},reg=c.regime||{},bots=c.bots||{};return `<section class="card"><h2>${esc(a.display_name)} <span class="pill">${esc(a.symbol)}</span></h2><div class="section">Regime engine</div><div class="table-scroll"><table><tr><td>Volatility window</td><td>${fmt(reg.realised_volatility_window_candles,0)} candles</td></tr><tr><td>Low threshold</td><td>${fmt(reg.low_volatility_threshold_pct,2)}%</td></tr><tr><td>High threshold</td><td>${fmt(reg.high_volatility_threshold_pct,2)}%</td></tr><tr><td>Fast / slow EMA</td><td>${fmt(reg.fast_ema,0)} / ${fmt(reg.slow_ema,0)}</td></tr></table></div><div class="section">DCA bots</div><div class="table-scroll"><table><tr><th>Regime</th><th>TP</th><th>SO dev</th><th>SO</th><th>Vol scale</th><th>Step</th></tr>${Object.entries(bots).map(([name,b])=>`<tr><td>${esc(name)}</td><td>${b.enabled===false?'Disabled':fmt(b.take_profit_pct,1)+'%'}</td><td>${fmt(b.so_deviation_pct,1)}${b.so_deviation_pct!=null?'%':''}</td><td>${fmt(b.safety_orders,0)}</td><td>${fmt(b.volume_scale,2)}</td><td>${fmt(b.step_scale,2)}</td></tr>`).join('')}</table></div><div class="section">Entry filters</div><div class="table-scroll"><table><tr><th>Scope</th><th>Rule</th><th>Value</th></tr>${filterRows(c.entry_filter)}</table></div></section>`}).join('')+`<p class="muted">Strategy version ${esc(data.version)} · updated ${esc(new Date(data.generated_at).toLocaleString())}</p>`}catch(e){box.innerHTML=`<section class="card error"><h2>Settings could not load</h2><p>${esc(e.message)}</p></section>`}}load();
</script><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script><script src="workspace.js?v=37.1.0"></script><script src="design-system.js?v=37.1.0"></script></body></html>
