<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><title>Decision Timeline</title><style>:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--blue:#6db7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:960px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 16px 50px}h1{font-size:38px;margin:10px 0}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:25px;padding:22px;margin:16px 0}.metric{background:#091626;border:1px solid var(--line);border-radius:16px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}a{color:#9fd0ff}.version{background:#25405e;padding:9px 13px;border-radius:99px;font-weight:800}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}</style><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"><link rel="stylesheet" href="workspace.css?v=64.0.0"><link rel="stylesheet" href="design-system.css?v=64.0.0"></head><body><main><div class="head"><div><h1>Decision Timeline</h1><p class="muted">A read-only chronology derived from the current production, research and validation state.</p></div><span class="version">V64.0.0</span></div><div id="content"><section class="panel">Loading…</section></div><script>
async function run(){const d=await (await fetch('strategies.json?t='+Date.now(),{cache:'no-store'})).json();const now=new Date(d.generated_at);document.getElementById('content').innerHTML=d.assets.map(a=>{const l=a.latest||{},fv=((d.forward_validation||{}).candidates||[]).find(x=>x.asset_id===a.id);const items=[['Current snapshot',now.toLocaleString(),a.production_status==='production'?(l.entry_allowed?'Entry filters pass':'Entry blocked'):'Research only'],['Latest market decision',a.history_end||'—',l.entry_reason||'No reason recorded'],['Validation stage',fv?.forward_start||a.history_end||'—',fv?.status||(a.production_status==='production'?'Production baseline':'Awaiting validation')]];return `<section class="panel"><h2>${esc(a.symbol)}</h2><div class="timeline-list">${items.map(x=>`<div class="timeline-item"><strong>${esc(x[0])}</strong><div class="muted">${esc(x[1])}</div><div>${esc(x[2])}</div></div>`).join('')}</div></section>`}).join('')}
run().catch(e=>document.getElementById('content').innerHTML='<section class="panel">'+esc(e.message)+'</section>');
</script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=(n,d=1)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';</script><a class="v24-dashboard-home" href="index.html">← Dashboard</a></main><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script><script src="workspace.js?v=64.0.0"></script><script src="design-system.js?v=64.0.0"></script></body></html>
