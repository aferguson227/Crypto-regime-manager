<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>SUI Hypothesis Engine</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--purple:#a98ad6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:1040px;margin:auto;padding:22px 16px 50px}.muted{color:var(--muted)}.nav{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-size:13px;font-weight:750}.nav a.active{background:#eef5ff;color:#091626}.card{border:1px solid var(--line);background:rgba(16,29,48,.96);border-radius:24px;padding:20px;margin:15px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;background:#563b78}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.metric{background:#091626;border:1px solid var(--line);border-radius:16px;padding:13px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:17px}.experiment{border-left:4px solid var(--purple)}.candidate{background:#091626;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.candidate.winner{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}.rank{font-size:12px;color:var(--purple);font-weight:800}.rule{padding:12px;border-radius:14px;background:#162943;border:1px solid #38577b;font-weight:750}.pass{color:var(--ok)}.fail{color:var(--bad)}.notice{padding:13px;border-radius:14px;background:#372d16;border:1px solid #78622b;color:#ffe29a}.gate{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:11px 0}table{width:100%;border-collapse:collapse}td{padding:8px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
</style><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"><link rel="stylesheet" href="workspace.css?v=41.1.0"><link rel="stylesheet" href="design-system.css?v=41.1.0"></head><body><main><h1>SUI Hypothesis Engine</h1><p class="muted">Candidate A forward validation · automatic ranked one-variable experiments</p><div id="content"><section class="card">Loading SUI research data…</section></div><script>
const fmt=(n,d=2)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';const money=n=>`${Number(n)<0?'−':''}$${fmt(Math.abs(Number(n)||0),2)}`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function candidate(c,w){const m=c.metrics||{},x=c.comparison||{};return `<div class="candidate ${w?'winner':''}"><div class="top"><div><div class="rank">#${c.rank} ${w?'TOP HYPOTHESIS':''}</div><h3>${esc(c.candidate_id)} — ${esc(c.candidate_name)}</h3></div><strong class="${x.diagnostic_pass?'pass':'fail'}">${x.diagnostic_pass?'PASS':'REJECT'}</strong></div><p>${esc(c.hypothesis)}</p><div class="rule">Only amended variable: ${esc((c.amendment||{}).human_rule)}</div><div class="grid"><div class="metric"><span>Net P&L</span><strong>${money(m.net_pnl)}</strong></div><div class="metric"><span>Net improvement</span><strong>${money(x.net_pnl_improvement)}</strong></div><div class="metric"><span>Longest trade</span><strong>${fmt((m.effective_longest_trade_hours||0)/24,1)}d</strong></div><div class="metric"><span>Duration reduced</span><strong>${fmt((x.effective_longest_trade_reduction_hours||0)/24,1)}d</strong></div><div class="metric"><span>Max drawdown</span><strong>${fmt(m.maximum_drawdown_pct_of_capital,1)}%</strong></div><div class="metric"><span>Closed deals</span><strong>${fmt(x.candidate_closed_deals??m.closed_deals,0)}</strong></div><div class="metric"><span>Deal-count change</span><strong>${(Number(x.closed_deal_count_change||0)>0?'+':'')+fmt(x.closed_deal_count_change,0)}</strong></div><div class="metric"><span>Problem trade changed</span><strong>${x.blocked_or_replaced_current_problem_trade?'YES':'NO'}</strong></div><div class="metric"><span>Rank score</span><strong>${fmt(c.rank_score,1)}</strong></div></div></div>`}
async function load(){const r=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),a=d.assets.find(x=>x.id==='SUI');if(!a)throw new Error('SUI research asset is not present');const rr=a.research||{},ex=a.experiment||{},base=ex.baseline_metrics||{},g=rr.gates||{},checks=rr.checks||{};const gate=(l,k,t)=>`<div class="gate"><span>${esc(l)} <span class="muted">${esc(t)}</span></span><strong class="${checks[k]?'pass':'fail'}">${checks[k]?'PASS':'NOT YET'}</strong></div>`;document.getElementById('content').innerHTML=`<section class="card"><div class="top"><div><div class="muted">SUI-USDT · V${esc(d.version)}</div><h2>${esc(rr.promotion_status)}</h2><p class="muted">Research only — no live signals</p></div><span class="badge">NO LIVE SIGNALS</span></div><div class="grid"><div class="metric"><span>Forward days</span><strong>${fmt(rr.forward_days,1)}</strong></div><div class="metric"><span>KuCoin candles</span><strong>${fmt(rr.forward_candles,0)}</strong></div><div class="metric"><span>Net P&L</span><strong>${money(a.net_pnl)}</strong></div><div class="metric"><span>Effective longest</span><strong>${fmt((rr.effective_longest_trade_hours||0)/24,1)}d</strong></div></div></section><section class="card experiment"><div class="top"><div><div class="muted">AUTOMATIC RESEARCH QUEUE</div><h2>${esc(ex.status||'Waiting')}</h2><p>Problem regime: <strong>${esc(ex.problem_regime||'—')}</strong></p></div><span class="badge">MANUAL APPROVAL</span></div><ul>${(ex.diagnosis||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="candidate"><h3>Candidate A — frozen baseline</h3><div class="grid"><div class="metric"><span>Net P&L</span><strong>${money(base.net_pnl)}</strong></div><div class="metric"><span>Longest trade</span><strong>${fmt((base.effective_longest_trade_hours||0)/24,1)}d</strong></div><div class="metric"><span>Max drawdown</span><strong>${fmt(base.maximum_drawdown_pct_of_capital,1)}%</strong></div><div class="metric"><span>Closed deals</span><strong>${fmt(base.closed_deals,0)}</strong></div></div></div>${(ex.candidates||[]).map((c,i)=>candidate(c,i===0)).join('')}<p class="notice">${esc(ex.caveat||'All results are post-hoc diagnostics.')}</p><p class="muted">${esc(ex.manual_approval_note||'Manual approval is required.')}</p></section><section class="card"><h2>Candidate A promotion gates</h2>${gate('At least 90 forward days','minimum_forward_days','≥ '+fmt(g.minimum_forward_days,0)+' days')}${gate('At least 540 forward candles','minimum_forward_candles','≥ '+fmt(g.minimum_forward_candles,0))}${gate('Positive marked-to-market P&L','positive_net_pnl','> $0')}${gate('Maximum drawdown','maximum_drawdown','≤ '+fmt(g.maximum_drawdown_pct,0)+'%')}${gate('Longest effective trade','maximum_effective_trade_days','≤ '+fmt(g.maximum_effective_trade_days,0)+' days')}${gate('Profitable 30-day windows','profitable_windows','≥ '+fmt(g.minimum_profitable_windows,0))}</section>`}load().catch(e=>document.getElementById('content').innerHTML=`<section class="card"><h2>Could not load research</h2><p>${esc(e.message)}</p></section>`);
</script></main><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script><script src="workspace.js?v=41.1.0"></script><script src="design-system.js?v=41.1.0"></script></body></html>
