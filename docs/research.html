<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>SUI Research Experiments</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--purple:#a98ad6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:1040px;margin:auto;padding:22px 16px 50px}.muted{color:var(--muted)}.nav{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-size:13px;font-weight:750}.nav a.active{background:#eef5ff;color:#091626}.card{border:1px solid var(--line);background:rgba(16,29,48,.96);border-radius:24px;padding:20px;margin:15px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;background:#563b78}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.metric{background:#091626;border:1px solid var(--line);border-radius:16px;padding:13px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:17px}.gate{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:11px 0}.pass{color:var(--ok)}.fail{color:var(--bad)}.wait{color:var(--warn)}.experiment{border-left:4px solid var(--purple)}.compare{display:grid;grid-template-columns:1fr;gap:12px}.candidate{background:#091626;border:1px solid var(--line);border-radius:18px;padding:16px}.candidate h3{margin:0 0 10px}.delta.good{color:var(--ok)}.delta.bad{color:var(--bad)}.rule{padding:13px;border-radius:14px;background:#162943;border:1px solid #38577b;font-weight:750}.notice{padding:13px;border-radius:14px;background:#372d16;border:1px solid #78622b;color:#ffe29a}.diagnosis li{margin:8px 0}table{width:100%;border-collapse:collapse}td{padding:9px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.compare{grid-template-columns:1fr 1fr}}</style></head><body><main><h1>SUI Research Experiments</h1><p class="muted">Candidate A forward validation · automatic one-variable Candidate B diagnostics</p><nav class="nav"><a href="index.html">Dashboard</a><a href="intelligence.html">Trading Intelligence</a><a href="health.html">Strategy Health</a><a href="settings.html">Settings</a><a class="active" href="research.html">Research</a></nav><div id="content"><section class="card">Loading SUI research data…</section></div><script>
const fmt=(n,d=2)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';const money=n=>`${Number(n)<0?'−':''}$${fmt(Math.abs(Number(n)||0),2)}`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const candidateCard=(title,m)=>`<div class="candidate"><h3>${esc(title)}</h3><table><tr><td>Net P&L</td><td>${money(m.net_pnl)}</td></tr><tr><td>Max drawdown</td><td>${fmt(m.maximum_drawdown_pct_of_capital,1)}%</td></tr><tr><td>Effective longest trade</td><td>${fmt((m.effective_longest_trade_hours||0)/24,1)}d</td></tr><tr><td>Closed deals</td><td>${fmt(m.closed_deals,0)}</td></tr><tr><td>Profitable windows</td><td>${fmt(m.profitable_windows,0)}</td></tr><tr><td>Open P&L</td><td>${money(m.open_pnl)}</td></tr></table></div>`;
async function load(){const r=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),a=d.assets.find(x=>x.id==='SUI');if(!a)throw new Error('SUI research asset is not present');const rr=a.research||{},l=a.latest||{},g=rr.gates||{},checks=rr.checks||{},ex=a.experiment||{};const gate=(label,key,target)=>`<div class="gate"><span>${esc(label)} <span class="muted">${esc(target||'')}</span></span><strong class="${checks[key]?'pass':(rr.forward_candles?'fail':'wait')}">${checks[key]?'PASS':(rr.forward_candles?'NOT YET':'WAIT')}</strong></div>`;const cmp=ex.comparison||{},am=ex.amendment||{},bm=ex.baseline_metrics||{},cm=ex.candidate_metrics||{};document.getElementById('content').innerHTML=`
<section class="card"><div class="top"><div><div class="muted">SUI-USDT · V${esc(d.version)}</div><h2>${esc(rr.promotion_status||'Waiting for first sync')}</h2><p class="muted">${esc(rr.label||'Research only')}</p></div><span class="badge">NO LIVE SIGNALS</span></div><div class="grid"><div class="metric"><span>Forward start</span><strong>${esc((rr.forward_test_start||'').slice(0,10)||'—')}</strong></div><div class="metric"><span>Forward days</span><strong>${fmt(rr.forward_days,1)}</strong></div><div class="metric"><span>KuCoin candles</span><strong>${fmt(rr.forward_candles,0)}</strong></div><div class="metric"><span>Net P&L</span><strong>${money(a.net_pnl)}</strong></div><div class="metric"><span>Max drawdown</span><strong>${fmt(a.maximum_drawdown_pct_of_capital,1)}%</strong></div><div class="metric"><span>Effective longest trade</span><strong>${fmt((rr.effective_longest_trade_hours||0)/24,1)}d</strong></div><div class="metric"><span>Profitable windows</span><strong>${fmt(rr.profitable_windows,0)}</strong></div><div class="metric"><span>Current regime</span><strong>${esc(l.regime||'—')}</strong></div></div></section>
<section class="card experiment"><div class="top"><div><div class="muted">AUTOMATIC EXPERIMENT</div><h2>${esc(ex.candidate_name||'Candidate B')}</h2><p class="muted">${esc(ex.status||'Waiting for diagnostic')}</p></div><span class="badge">MANUAL APPROVAL</span></div><p>${esc(ex.hypothesis||'The app will generate a one-variable hypothesis when Candidate A fails a monitored risk gate.')}</p>${am.human_rule?`<div class="rule">Only amended variable: ${esc(am.human_rule)}</div>`:''}<ul class="diagnosis">${(ex.diagnosis||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${bm.net_pnl!==undefined?`<div class="compare">${candidateCard('Candidate A — frozen baseline',bm)}${candidateCard('Candidate B — diagnostic',cm)}</div><div class="grid"><div class="metric"><span>Net improvement</span><strong class="delta ${Number(cmp.net_pnl_improvement)>=0?'good':'bad'}">${money(cmp.net_pnl_improvement)}</strong></div><div class="metric"><span>Duration reduction</span><strong class="delta ${Number(cmp.effective_longest_trade_reduction_hours)>0?'good':'bad'}">${fmt((cmp.effective_longest_trade_reduction_hours||0)/24,1)}d</strong></div><div class="metric"><span>Drawdown change</span><strong>${fmt(cmp.maximum_drawdown_change_pct_points,1)}pp</strong></div><div class="metric"><span>Problem trade changed</span><strong>${cmp.blocked_or_replaced_current_problem_trade?'YES':'NO'}</strong></div></div>`:''}<p class="notice">${esc(ex.caveat||'Candidate B cannot replace Candidate A automatically.')}</p><p class="muted">${esc(ex.manual_approval_note||'Manual approval is required before a new independent forward comparison begins.')}</p></section>
<section class="card"><h2>Candidate A promotion gates</h2>${gate('At least 90 forward days','minimum_forward_days','≥ '+fmt(g.minimum_forward_days,0)+' days')}${gate('At least 540 forward candles','minimum_forward_candles','≥ '+fmt(g.minimum_forward_candles,0))}${gate('Positive marked-to-market P&L','positive_net_pnl','> $0')}${gate('Maximum drawdown','maximum_drawdown','≤ '+fmt(g.maximum_drawdown_pct,0)+'%')}${gate('Longest effective trade','maximum_effective_trade_days','≤ '+fmt(g.maximum_effective_trade_days,0)+' days')}${gate('Profitable 30-day windows','profitable_windows','≥ '+fmt(g.minimum_profitable_windows,0))}<p class="muted">Passing every gate only triggers manual review. It never promotes SUI automatically.</p></section>
<section class="card"><h2>Frozen Candidate A</h2><table><tr><td>Low filter</td><td>RSI ≤60; ≤5% above EMA50; 24h return ≤0%; ≥10% below 20d high; EMA50 slope ≥−0.02%</td></tr><tr><td>Medium filter</td><td>24h return ≥−4%</td></tr><tr><td>High-Bull filter</td><td>24h return 0% to +8%</td></tr><tr><td>High-Bear</td><td>Blocked</td></tr></table><p class="muted">Kraken research P&L and KuCoin forward P&L are intentionally kept separate.</p></section>`}load().catch(e=>document.getElementById('content').innerHTML=`<section class="card"><h2>Could not load SUI research</h2><p>${esc(e.message)}</p></section>`);
</script></main></body></html>
