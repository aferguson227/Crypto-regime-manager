<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Strategy Evolution</title><style>:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--purple:#b193e0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:1050px;margin:auto;padding:22px 16px 60px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-weight:750;font-size:13px}.nav a.active{background:#eef5ff;color:#091626}.card{border:1px solid var(--line);background:rgba(16,29,48,.96);border-radius:24px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric,.item{background:#091626;border:1px solid var(--line);border-radius:16px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:18px}.muted{color:var(--muted)}.badge{display:inline-block;background:#563b78;padding:8px 12px;border-radius:999px;font-weight:800}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.winner{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}.rule{background:#162943;border:1px solid #38577b;border-radius:14px;padding:12px;margin:8px 0}.notice{background:#372d16;border:1px solid #78622b;color:#ffe29a;border-radius:14px;padding:14px}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}</style><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"></head><body><main><h1>Strategy Evolution Engine</h1><p class="muted">Controlled suggestions · single-rule evidence first · combinations second</p><nav class="v20-nav"><a href="index.html">Dashboard</a><a href="cockpit.html">Cockpit</a><a href="research.html">Research</a><a href="discovery.html">Discovery</a><a href="data.html">Data</a><a class="active" href="more.html">More</a></nav><div class="v20-tools"><a href="explainability.html">Why this decision</a><a href="timeline.html">Timeline</a><a href="integrity.html">Data integrity</a></div><div id="content"><section class="card">Loading suggestions…</section></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const f=(n,d=1)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';const money=n=>`${Number(n)<0?'−':''}$${f(Math.abs(Number(n)||0),2)}`;function combo(c,w){const x=c.comparison||{},m=c.metrics||{};return `<div class="item ${w?'winner':''}"><h3>#${c.rank} ${esc(c.combination_id)} — ${esc(c.name)}</h3>${(c.rules||[]).map(r=>`<div class="rule">${esc(r)}</div>`).join('')}<div class="grid"><div class="metric"><span>Net P&L</span><strong>${money(m.net_pnl)}</strong></div><div class="metric"><span>Improvement</span><strong>${money(x.net_pnl_improvement)}</strong></div><div class="metric"><span>Longest trade</span><strong>${f((m.effective_longest_trade_hours||0)/24)}d</strong></div><div class="metric"><span>Closed deals</span><strong>${f(x.candidate_closed_deals??m.closed_deals,0)}</strong></div><div class="metric"><span>Deal-count change</span><strong>${Number(x.closed_deal_count_change||0)>0?'+':''}${f(x.closed_deal_count_change,0)}</strong></div></div><p class="${x.diagnostic_pass?'ok':'bad'}"><strong>${x.diagnostic_pass?'PASS':'REJECT'}</strong></p></div>`}async function load(){const r=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'}),d=await r.json(),a=d.assets.find(x=>x.id==='SUI'),e=a?.evolution;if(!e)throw new Error('Evolution results are not available yet. Run the main workflow.');const rec=e.recommendation||{};document.getElementById('content').innerHTML=`<section class="card"><span class="badge">MANUAL APPROVAL</span><h2>${esc(rec.title)}</h2><p class="warn"><strong>${esc(rec.status)}</strong></p><p>${esc(rec.reason)}</p><div class="grid"><div class="metric"><span>Hypotheses tested</span><strong>${f(e.audit?.individual_hypotheses_tested,0)}</strong></div><div class="metric"><span>Passed</span><strong>${f(e.audit?.individual_hypotheses_passed,0)}</strong></div><div class="metric"><span>Distinct suggestions</span><strong>${f(e.audit?.qualified_suggestions,0)}</strong></div><div class="metric"><span>Combinations tested</span><strong>${f(e.audit?.combinations_tested,0)}</strong></div></div></section><section class="card"><h2>Suggested next experiments</h2>${(e.single_rule_suggestions||[]).map((s,i)=>`<div class="item ${i===0?'winner':''}"><h3>${i+1}. ${esc(s.candidate_id)} — ${esc(s.title)}</h3><p>${esc(s.reason)}</p><p class="muted">${esc(s.recommended_action)}</p></div>`).join('')||'<p>No qualified single-rule suggestions.</p>'}</section><section class="card"><h2>Compatible combinations</h2>${(e.combination_candidates||[]).map((c,i)=>combo(c,i===0&&c.comparison?.diagnostic_pass)).join('')||'<p class="muted">No combinations were tested.</p>'}</section><section class="card"><h2>Correlated hypothesis clusters</h2>${(e.correlated_hypothesis_clusters||[]).map(c=>`<div class="item"><h3>${esc((c.candidate_ids||[]).join(' · '))}</h3><p>Representative: <strong>${esc(c.representative_id)}</strong></p><p class="muted">${esc(c.reason)}</p></div>`).join('')||'<p class="muted">No equivalent-result clusters were detected.</p>'}</section><section class="card"><h2>Safeguards</h2><ul>${(e.safeguards||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="notice">${esc(e.note)}</p></section>`}load().catch(e=>document.getElementById('content').innerHTML=`<section class="card"><h2>Could not load evolution results</h2><p>${esc(e.message)}</p></section>`);</script></main><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script></body></html>
