<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Crypto Regime Manager</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100vh}main{max-width:920px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(42px + env(safe-area-inset-bottom))}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand h1{margin:3px 0;font-size:30px}.sub,.muted{color:var(--muted)}.sub{margin:0}.nav{display:flex;gap:8px;margin:18px 0}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-size:13px;font-weight:750}.nav a.active{background:#eef5ff;color:#091626}.statusbar{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#0c1929;border:1px solid var(--line);padding:12px 14px;border-radius:16px;margin:12px 0 4px}.status{font-weight:800}.status.ok{color:var(--ok)}.status.warning{color:var(--warn)}.asset{border:1px solid var(--line);background:rgba(16,29,48,.96);border-radius:26px;padding:22px;margin:16px 0;box-shadow:0 18px 50px rgba(0,0,0,.2)}.top{display:flex;justify-content:space-between;gap:12px}.symbol{color:var(--muted);font-size:13px;letter-spacing:.12em}.regime{font-size:36px;font-weight:850;margin:6px 0}.badge{align-self:flex-start;border-radius:99px;padding:8px 12px;font-size:13px;font-weight:800;background:#25405e}.allowed{background:#164e3c}.blocked{background:#6d2531}.decision{margin-top:16px;padding:16px;border-radius:18px;background:#091626;border:1px solid var(--line)}.decision strong{display:block;font-size:19px;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.metric{background:#091626;border:1px solid var(--line);border-radius:16px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.metric strong{font-size:17px}.settings{width:100%;border-collapse:collapse;margin-top:14px}.settings td{border-bottom:1px solid var(--line);padding:9px 0}.settings td:last-child{text-align:right;font-weight:700}.open{margin-top:14px;background:#4e3514;border:1px solid #745524;padding:14px;border-radius:16px}.footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.5}.refresh{width:100%;padding:14px;border:0;border-radius:15px;font-size:16px;font-weight:800;background:#eef5ff;color:#091626}.error{background:#53202b}.low .regime{color:#66dfb5}.medium .regime{color:#ffd76b}.high-bull .regime{color:#6db7ff}.high-bear .regime{color:#ff8093}@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main>
<div class="header"><div class="brand"><h1>Crypto Regime Manager</h1><p class="sub">TEL and TAO · KuCoin 4-hour strategies</p></div><div id="version" class="badge">V5.1</div></div>
<nav class="nav"><a class="active" href="./">Dashboard</a><a href="settings.html">Settings</a></nav>
<div class="statusbar"><span id="health" class="status">Loading workflow status…</span><span id="updated" class="muted">—</span></div>
<div id="content"><section class="asset">Loading latest strategy data…</section></div><button class="refresh" onclick="load()">Refresh dashboard</button><p class="footer">Use the recommended bot only when entry is allowed. A blocked entry or later regime change must not alter an existing open deal.</p>
</main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toLocaleString(undefined,{maximumFractionDigits:d}):'—';
async function load(){const box=document.getElementById('content');try{const r=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();document.getElementById('version').textContent='V'+esc(data.version||'5.1');document.getElementById('updated').textContent='Updated '+new Date(data.generated_at).toLocaleString();const health=document.getElementById('health');health.textContent=data.workflow_status==='ok'?'● Data update healthy':'● Data update warning';health.className='status '+(data.workflow_status==='ok'?'ok':'warning');box.innerHTML=data.assets.map(a=>{const l=a.latest||{},b=l.bot_settings||{},allowed=l.entry_allowed,op=a.open_position,sync=a.sync||{};return `<section class="asset ${esc((l.regime||'').toLowerCase())}"><div class="top"><div><div class="symbol">${esc(a.symbol)}</div><div class="regime">${esc(l.regime||'Unavailable')}</div></div><span class="badge ${allowed?'allowed':'blocked'}">${allowed?'ENTRY ALLOWED':'ENTRY BLOCKED'}</span></div><div class="decision"><strong>${allowed?`Use ${esc(l.recommended_bot||'recommended bot')}`:'Do not start a new deal'}</strong><div class="muted">${esc(l.entry_reason||'')}</div></div><div class="grid"><div class="metric"><span>Last close</span><strong>${fmt(l.last_close,8)}</strong></div><div class="metric"><span>20-day realised vol</span><strong>${fmt(l.rv,1)}%</strong></div><div class="metric"><span>RSI(14)</span><strong>${fmt(l.rsi14,1)}</strong></div><div class="metric"><span>24h return</span><strong>${fmt(l.return24,1)}%</strong></div><div class="metric"><span>Distance from EMA50</span><strong>${fmt(l.distance_ema50,1)}%</strong></div><div class="metric"><span>Distance from EMA200</span><strong>${fmt(l.distance_ema200,1)}%</strong></div><div class="metric"><span>Replay net P&L</span><strong>$${fmt(a.net_pnl,2)}</strong></div><div class="metric"><span>Longest completed trade</span><strong>${fmt(a.longest_trade_hours/24,1)} days</strong></div></div><table class="settings"><tr><td>Take profit</td><td>${fmt(b.take_profit_pct,1)}%</td></tr><tr><td>SO deviation</td><td>${fmt(b.so_deviation_pct,1)}%</td></tr><tr><td>Safety orders</td><td>${fmt(b.safety_orders,0)}</td></tr><tr><td>Volume scale</td><td>${fmt(b.volume_scale,2)}</td></tr><tr><td>Step scale</td><td>${fmt(b.step_scale,2)}</td></tr></table>${op?`<div class="open"><strong>Open position</strong><div class="muted">${esc(op.regime)} · ${fmt(op.hours_open/24,1)} days · P&L $${fmt(op.open_pnl,2)} · ${fmt(op.required_rise_pct,1)}% rise needed</div></div>`:''}<p class="muted" style="font-size:12px">Data through ${esc(a.history_end)} · ${fmt(a.closed_deals,0)} closed deals · max drawdown ${fmt(a.maximum_drawdown_pct_of_capital,1)}% · ${sync.error?'sync warning: '+esc(sync.error):fmt(sync.new_candles,0)+' new candles'}</p></section>`}).join('')}catch(e){document.getElementById('health').textContent='● Dashboard error';document.getElementById('health').className='status warning';box.innerHTML=`<section class="asset error"><h2>Dashboard could not load</h2><p>${esc(e.message)}</p></section>`}}load();
</script></body></html>
