<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101d"><title>Assets</title><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"><link rel="stylesheet" href="workspace.css?v=41.0.0"><link rel="stylesheet" href="design-system.css?v=41.0.0"></head><body><div class="shell"><header class="topbar"><div><div class="eyebrow">Crypto Regime Manager</div><h1>Assets</h1><p class="sub">One workspace per coin: decision, performance, risk, settings and research.</p></div><span id="version" class="version">V41.0.0</span></header><div class="search"><input id="globalSearch" placeholder="Search assets and sections…" aria-label="Search"></div><main id="root"><section class="card">Loading Assets…</section></main></div><div id="nav"></div><script src="v20.js"></script><script>document.getElementById('nav').innerHTML=nav('assets');
let currentAsset=null;getAll().then(({data,tc,release})=>{document.getElementById('version').textContent='V'+esc(release.version||'22.0.0');const requested=new URLSearchParams(location.search).get('asset'),ops=(data.operational_intelligence||{}).assets||[],raw=data.assets||[],fv=(data.forward_validation||{}).candidates||[];currentAsset=requested||ops[0]?.asset_id;const buttons=ops.map(a=>`<button class="${a.asset_id===currentAsset?'active':''}" data-id="${esc(a.asset_id)}">${esc(a.symbol)}</button>`).join('');document.getElementById('root').innerHTML=`<section class="card"><div class="section-tabs" id="assetTabs">${buttons}</div><div id="assetBody"></div></section>`;function render(id){currentAsset=id;document.querySelectorAll('#assetTabs button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const a=ops.find(x=>x.asset_id===id),r=raw.find(x=>x.id===id)||{},l=r.latest||{},h=r.health||{},b=l.bot_settings||{},v=fv.find(x=>x.asset_id===id);if(!a)return;const settings=[['Take profit',fmt(b.take_profit_pct,1)+'%'],['SO deviation',fmt(b.so_deviation_pct,1)+'%'],['Safety orders',fmt(b.safety_orders)],['Volume scale',fmt(b.volume_scale,2)],['Step scale',fmt(b.step_scale,2)],['Max capital','$'+fmt(b.max_capital,0)]];document.getElementById('assetBody').innerHTML=`<div class="asset-top"><div><div class="eyebrow">${esc(a.production_status)}</div><h2>${esc(a.symbol)} · ${esc(a.regime)}</h2></div><span class="status ${cssState(a.production_status==='RESEARCH'?'RESEARCH':a.entry_allowed?'READY':'WAIT')}">${a.production_status==='RESEARCH'?'RESEARCH':a.entry_allowed?'READY':'WAIT'}</span></div><div class="section-tabs" id="insideTabs"><button class="active" data-p="overview">Overview</button><button data-p="performance">Performance</button><button data-p="risk">Risk</button><button data-p="configuration">Configuration</button><button data-p="research">Research</button><button data-p="history">History</button></div><div id="overview" class="panel active"><div class="grid"><div class="metric"><span>Opportunity</span><strong>${fmt(a.opportunity_score)}/100</strong></div><div class="metric"><span>Health</span><strong>${fmt(a.health_score)}/100</strong></div><div class="metric"><span>Decision</span><strong>${a.production_status==='RESEARCH'?'Research only':a.entry_allowed?'Ready':'Wait'}</strong></div><div class="metric"><span>Regime</span><strong>${esc(a.regime)}</strong></div></div><div class="action"><strong>Next manual action</strong><div>${esc(a.next_action)}</div></div><details class="disclosure"><summary>Why this decision?</summary><p>${esc(a.entry_reason||l.entry_reason||'No additional explanation recorded.')}</p><a class="button" href="explainability.html">Full explanation</a></details></div><div id="performance" class="panel"><div class="grid"><div class="metric"><span>Replay P&amp;L</span><strong>$${fmt(r.net_pnl,2)}</strong></div><div class="metric"><span>Recent 90d P&amp;L</span><strong>$${fmt(h.recent_realised_pnl,2)}</strong></div><div class="metric"><span>Closed deals</span><strong>${fmt(r.closed_deals)}</strong></div><div class="metric"><span>Average duration</span><strong>${fmt((h.recent_average_trade_hours||0)/24,1)}d</strong></div></div><a class="button" href="health.html">Detailed performance</a></div><div id="risk" class="panel">${r.open_position?`<div class="action redaction"><strong>Replay open position</strong><div>${fmt(r.open_position.hours_open/24,1)} days · $${fmt(r.open_position.open_pnl,2)} · ${fmt(r.open_position.required_rise_pct,1)}% recovery needed</div></div>`:'<div class="empty">No unresolved replay position.</div>'}<div class="grid"><div class="metric"><span>Recent drawdown</span><strong>${fmt(h.recent_max_drawdown_pct_of_capital,1)}%</strong></div><div class="metric"><span>Data integrity</span><strong>${a.data_ready?'Ready':'Review'}</strong></div></div></div><div id="configuration" class="panel"><p class="muted">Active configuration for the current ${esc(a.regime)} regime.</p><details class="regime" open><summary>${esc(a.regime)} strategy</summary><div class="regime-grid">${settings.map(s=>`<div class="setting"><span>${s[0]}</span><strong>${s[1]}</strong></div>`).join('')}</div></details><p class="muted small">Configuration is read-only. No setting can be changed here.</p><a class="button" href="settings.html">Advanced settings audit</a></div><div id="research" class="panel">${v?`<div class="grid"><div class="metric"><span>Forward days</span><strong>${fmt(v.forward_days,1)}</strong></div><div class="metric"><span>Forward candles</span><strong>${fmt(v.forward_candles)}</strong></div><div class="metric"><span>Candidate deals</span><strong>${fmt(v.candidate_metrics&&v.candidate_metrics.closed_deals)}</strong></div><div class="metric"><span>Status</span><strong>${esc(v.status)}</strong></div></div>`:'<div class="empty">Production baseline; no independent candidate attached.</div>'}<a class="button" href="research.html">Open Research workflow</a></div><div id="history" class="panel"><div class="timeline-item"><strong>Current decision</strong><div class="muted">${esc(a.next_action)}</div></div><div class="timeline-item"><strong>Latest data</strong><div class="muted">${esc(r.history_end||'—')}</div></div><a class="button" href="timeline.html">Full decision history</a></div>`;document.querySelectorAll('#insideTabs button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('#insideTabs button').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===btn.dataset.p))})}document.querySelectorAll('#assetTabs button').forEach(b=>b.onclick=()=>render(b.dataset.id));render(currentAsset);addSearch(data)}).catch(err=>document.getElementById('root').innerHTML=`<section class="card"><h2>Assets unavailable</h2><p>${esc(err.message)}</p></section>`);
</script><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script><script src="workspace.js?v=41.0.0"></script><script src="design-system.js?v=41.0.0"></script></body></html>
