<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Context & Traits</title><style>:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--purple:#b193e0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:1100px;margin:auto;padding:22px 16px 60px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-weight:750;font-size:13px}.nav a.active{background:#eef5ff;color:#091626}.card{border:1px solid var(--line);background:rgba(16,29,48,.96);border-radius:24px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric,.item{background:#091626;border:1px solid var(--line);border-radius:16px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:18px}.muted{color:var(--muted)}.badge{display:inline-block;background:#563b78;padding:8px 12px;border-radius:999px;font-weight:800}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.notice{background:#372d16;border:1px solid #78622b;color:#ffe29a;border-radius:14px;padding:14px}.tree{border-left:4px solid var(--purple)}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}</style><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v24.css"><link rel="stylesheet" href="v29.css"><link rel="stylesheet" href="v30_3.css?v=30.3.0"><link rel="stylesheet" href="v31.css?v=31.2.0"><link rel="stylesheet" href="v31_2.css?v=31.2.1"><link rel="stylesheet" href="workspace.css?v=42.0.0"><link rel="stylesheet" href="design-system.css?v=42.0.0"></head><body><main><h1>Context & Trait Engine</h1><p class="muted">Turns rule-level evidence into cautious asset traits and a structured research tree.</p><div id="content"><section class="card">Loading contextual traits…</section></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const f=(n,d=1)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';function trait(t){return `<div class="metric"><span>${esc(t.name)}</span><strong>${f(t.score,2)}${t.unit?' '+esc(t.unit):''}</strong><p class="muted">${esc(t.label)} · ${esc(t.basis)}</p></div>`}async function load(){const r=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'}),d=await r.json(),a=d.context_traits;if(!a)throw new Error('Context traits are unavailable. Run the main workflow.');document.getElementById('content').innerHTML=`<section class="card"><span class="badge">RESEARCH ONLY</span><h2>Context-aware evidence</h2><div class="grid"><div class="metric"><span>Assets</span><strong>${f(a.audit?.assets_profiled,0)}</strong></div><div class="metric"><span>Evidence rules</span><strong>${f(a.audit?.evidence_rules,0)}</strong></div><div class="metric"><span>Research families</span><strong>${f(a.audit?.families,0)}</strong></div><div class="metric"><span>Engine</span><strong>V${esc(a.version)}</strong></div></div></section>${(a.profiles||[]).map(p=>`<section class="card"><h2>${esc(p.asset_id)} — ${esc(p.summary)}</h2><p class="warn"><strong>Confidence: ${esc(p.confidence)}</strong> · ${f(p.rules_tested,0)} rules tested</p><div class="grid">${(p.traits||[]).map(trait).join('')}</div><h3>Observed contexts</h3>${(p.contexts||[]).map(x=>`<div class="item"><strong>${esc(x.regime)} · ${esc(x.candidate_id)}</strong><p>${esc(x.rule)} — ${esc(x.outcome)}</p><p class="muted">P&L change ${f(x.net_pnl_change,2)} · duration reduction ${f((x.duration_reduction_hours||0)/24)}d</p></div>`).join('')||'<p class="muted">No context evidence yet.</p>'}</section>`).join('')}<section class="card"><h2>Research tree</h2>${(a.research_tree||[]).map(b=>`<div class="item tree"><h3>${esc(b.family)}</h3><p class="muted">${f(b.tested_count,0)} of ${f(b.total_count,0)} branches tested or diagnosed</p>${(b.children||[]).map(c=>`<p><strong>${esc(c.status).toUpperCase()}</strong> · ${esc(c.label)}</p>`).join('')}</div>`).join('')}</section><section class="card"><h2>Suggested next experiments</h2>${(a.next_experiments||[]).map(x=>`<div class="item"><h3>${x.priority}. ${esc(x.title)}</h3><p>${esc(x.reason)}</p><p class="warn"><strong>${esc(x.approval)}</strong></p></div>`).join('')}</section><section class="card"><h2>Safeguards</h2><ul>${(a.safeguards||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="notice">${esc(a.note)}</p></section>`}load().catch(e=>document.getElementById('content').innerHTML=`<section class="card"><h2>Could not load traits</h2><p>${esc(e.message)}</p></section>`);</script></main><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script><script src="v29.js"></script><script src="v30_3.js?v=30.3.0"></script><script src="v31.js?v=31.2.1"></script><script src="v31_2.js?v=31.2.1"></script><script src="workspace.js?v=42.0.0"></script><script src="design-system.js?v=42.0.0"></script></body></html>
