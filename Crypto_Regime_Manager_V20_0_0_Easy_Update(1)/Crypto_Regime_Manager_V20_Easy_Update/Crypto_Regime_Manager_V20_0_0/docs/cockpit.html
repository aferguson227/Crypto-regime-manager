<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>V17 Decision Cockpit</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--panel2:#0a1727;--line:#29415d;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--blue:#9fd0ff;--purple:#b493e6}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:980px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px 54px}.header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}h1{font-size:clamp(34px,8vw,64px);line-height:1.03;margin:10px 0}.sub,.muted{color:var(--muted)}.version,.pill{border-radius:999px;padding:9px 14px;font-weight:850}.version{background:#274767;white-space:nowrap}.nav,.jump{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.nav a,.jump a{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:760}.nav a.active{background:#eef5ff;color:#091626}.jump{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:5;background:rgba(7,17,31,.92);padding:8px;border-radius:18px;backdrop-filter:blur(10px)}.card{background:rgba(16,29,48,.98);border:1px solid var(--line);border-radius:26px;padding:22px;margin:18px 0}.hero{background:linear-gradient(135deg,#172e4d,#101d30)}.summary-grid,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;font-size:25px;margin-top:7px;overflow-wrap:anywhere}.portfolio-status{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0;padding:16px;border-radius:18px;background:#091626;border:1px solid var(--line)}.portfolio-status strong{font-size:28px}.asset-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{font-size:12px;background:#29415d}.production{background:#14523e;color:var(--ok)}.research{background:#56377a;color:#eadfff}.positive{background:#14523e;color:var(--ok)}.warning{background:#6a5119;color:var(--warn)}.critical{background:#6d2531;color:#ffd8df}.neutral{background:#29415d}.asset h2{font-size:30px;margin:4px 0}.decision{border:1px solid var(--line);background:#091626;border-radius:18px;padding:17px;margin:16px 0}.decision strong{display:block;font-size:25px;margin-top:6px}.opportunity{display:flex;align-items:center;justify-content:space-between;gap:12px}.score{font-size:42px;font-weight:900}.bar{height:10px;background:#203650;border-radius:999px;overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--ok))}.blockers{margin:10px 0 0;padding-left:21px;color:var(--muted);line-height:1.55}.next{border-left:5px solid var(--blue);padding:13px 15px;background:#0a1727;border-radius:10px;margin-top:15px}.alerts{display:grid;gap:10px}.alert{border-left:5px solid var(--warn);background:#2e2712;padding:14px;border-radius:12px}.alert.CRITICAL{border-color:var(--bad);background:#311821}.alert.INFO{border-color:var(--blue);background:#102439}.alert b{display:block;margin-bottom:3px}.guard{background:#322710;border:1px solid #7f6420;color:#ffe49a;border-radius:18px;padding:18px;line-height:1.5}.small{font-size:13px}.footer{text-align:center;color:var(--muted);margin-top:25px}details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-weight:800;color:var(--blue)}@media(min-width:760px){.summary-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.asset-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}}@media(max-width:520px){.card{padding:18px}.asset-head{display:block}.badges{justify-content:flex-start;margin-top:12px}.header{align-items:center}.portfolio-status strong{font-size:22px}}
</style><link rel="stylesheet" href="v20.css"></head><body><main><div class="header"><div><h1>Decision Cockpit</h1><p class="sub">A compact read-only operating view for production, research and validation.</p></div><span class="version" id="version">V20.0.0</span></div><nav class="v20-nav"><a href="index.html">Dashboard</a><a class="active" href="cockpit.html">Cockpit</a><a href="research.html">Research</a><a href="data.html">Data</a><a href="more.html">More</a></nav><div class="v20-tools"><a href="explainability.html">Why this decision</a><a href="timeline.html">Timeline</a><a href="integrity.html">Data integrity</a></div><div id="root"><section class="card">Loading operational intelligence…</section></div><p class="footer">V20 is advisory and read-only. It cannot open, close, pause or modify a live bot.</p></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=(n,d=0)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';
const slug=s=>String(s||'asset').toLowerCase().replace(/[^a-z0-9]+/g,'-');
async function load(){const root=document.getElementById('root');try{const r=await fetch('strategies.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json(),op=data.operational_intelligence;if(!op)throw new Error('Operational intelligence is not present. Run the V17 workflow.');document.getElementById('version').textContent='V'+esc(data.version||'20.0.0');const s=op.summary||{},g=op.guardrails||{},assets=op.assets||[],alerts=op.alerts||[];root.innerHTML=`<section class="card hero"><span class="pill neutral">READ-ONLY INTELLIGENCE</span><h2>Portfolio status</h2><div class="portfolio-status"><span class="muted">Overall operating posture</span><strong>${esc(s.portfolio_status||'STABLE')}</strong></div><div class="summary-grid"><div class="metric"><span>Production</span><strong>${fmt(s.production_assets)}</strong></div><div class="metric"><span>Research</span><strong>${fmt(s.research_assets)}</strong></div><div class="metric"><span>Entries allowed</span><strong>${fmt(s.entry_allowed)}</strong></div><div class="metric"><span>Review ready</span><strong>${fmt(s.review_ready)}</strong></div><div class="metric"><span>Replay positions</span><strong>${fmt(s.replay_positions)}</strong></div><div class="metric"><span>Alerts</span><strong>${fmt((s.critical_alerts||0)+(s.review_alerts||0))}</strong></div></div><p class="muted small">Generated ${new Date(op.generated_at).toLocaleString()}</p></section><nav class="jump">${assets.map(a=>`<a href="#${slug(a.asset_id)}">${esc(a.asset_id)}</a>`).join('')}</nav>${alerts.length?`<section class="card"><h2>Prioritised action queue</h2><div class="alerts">${alerts.map(a=>`<div class="alert ${esc(a.level)}"><b>${esc(a.level)} · ${esc(a.asset_id)}</b><div>${esc(a.message)}</div></div>`).join('')}</div></section>`:''}${assets.map(a=>{const score=Math.max(0,Math.min(100,Number(a.opportunity_score)||0));return `<section class="card asset" id="${slug(a.asset_id)}"><div class="asset-head"><div><div class="muted">${esc(a.symbol)}</div><h2>${esc(a.regime||'Unavailable')}</h2></div><div class="badges"><span class="pill ${a.production_status==='RESEARCH'?'research':'production'}">${esc(a.production_status)}</span><span class="pill ${esc(a.severity)}">${esc(a.readiness)}</span><span class="pill neutral">Health ${fmt(a.health_score)}/100</span></div></div><div class="asset-grid"><div><div class="decision"><span class="muted">Current decision</span><strong>${a.entry_allowed?'ENTRY FILTERS PASS':a.production_status==='RESEARCH'?'RESEARCH ONLY':'ENTRY BLOCKED'}</strong><p class="muted">${esc(a.recommended_bot||a.validation_state||'No bot recommendation')}</p></div><div class="next"><strong>Next manual action</strong><div>${esc(a.next_action)}</div></div></div><div><div class="metric"><div class="opportunity"><div><span>Opportunity</span><strong>${a.production_status==='RESEARCH'?'RESEARCH ONLY':score>=70?'READY':score>=50?'CAUTIOUS':'WAIT'}</strong></div><div class="score">${fmt(score)}<small>/100</small></div></div><div class="bar"><i style="width:${score}%"></i></div></div><div class="grid" style="margin-top:12px"><div class="metric"><span>Data</span><strong>${a.data_ok?'HEALTHY':'BLOCKED'}</strong></div><div class="metric"><span>Validation</span><strong style="font-size:16px">${esc(a.validation_state||'—')}</strong></div></div><details><summary>Evidence and cautions</summary><div class="grid" style="margin-top:12px"><div class="metric"><span>New candles</span><strong>${fmt(a.new_candles)}</strong></div><div class="metric"><span>History through</span><strong style="font-size:15px">${esc(a.history_end||'—')}</strong></div></div>${(a.blockers||[]).length?`<h3>Blockers / cautions</h3><ul class="blockers">${a.blockers.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">No recorded blockers.</p>'}</details></div></div></section>`}).join('')}<section class="card"><h2>Guardrails</h2><div class="guard"><strong>Live execution authorised: ${g.live_execution_authorised?'YES':'NO'}</strong><br>Automatic bot, DCA and exit changes remain disabled. Every action requires manual review and the existing forward-validation lifecycle.</div></section>`}catch(e){root.innerHTML=`<section class="card"><h2>Cockpit unavailable</h2><p>${esc(e.message)}</p></section>`}}load();
</script></body></html>
