<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101d"><title>Home</title><link rel="stylesheet" href="v20.css"></head><body><div class="shell"><header class="topbar"><div><div class="eyebrow">Crypto Regime Manager</div><h1>Home</h1><p class="sub">Decisions, actions and portfolio status in one place.</p></div><span id="version" class="version">V20.0.0</span></header><div class="search"><input id="globalSearch" placeholder="Search assets and sections…" aria-label="Search"></div><main id="root"><section class="card">Loading Home…</section></main></div><div id="nav"></div><script src="v20.js"></script><script>document.getElementById('nav').innerHTML=nav('home');
getAll().then(({data,tc,release})=>{document.getElementById('version').textContent='V'+esc(release.version||'20.0.0');const op=data.operational_intelligence||{},assets=op.assets||[],alerts=op.alerts||[],prod=assets.filter(a=>a.production_status!=='RESEARCH'),allowed=prod.filter(a=>a.entry_allowed),research=assets.filter(a=>a.production_status==='RESEARCH'),replays=(data.assets||[]).filter(a=>a.open_position).length;const overall=alerts.some(a=>String(a.level).toLowerCase().includes('critical'))?'ACTION REQUIRED':alerts.length?'REVIEW':'STABLE';document.getElementById('root').innerHTML=`<section class="card hero"><div class="asset-top"><div><div class="eyebrow">Portfolio status</div><h2>${esc(overall)}</h2></div><span class="status ${cssState(overall)}">${alerts.length} alert${alerts.length===1?'':'s'}</span></div><div class="grid"><div class="metric"><span>Production assets</span><strong>${prod.length}</strong></div><div class="metric"><span>Entries available</span><strong>${allowed.length}</strong></div><div class="metric"><span>Replay positions</span><strong>${replays}</strong></div><div class="metric"><span>Research assets</span><strong>${research.length}</strong></div></div></section><section class="card"><h2>Action queue</h2>${alerts.length?alerts.map(a=>`<div class="action ${String(a.level).toLowerCase().includes('critical')?'redaction':''}" data-search="${esc(a.asset_id+' '+a.message)}"><strong>${esc(a.asset_id)} · ${esc(a.level)}</strong><div>${esc(a.message)}</div></div>`).join(''):'<div class="empty">No urgent actions. Existing guardrails are operating normally.</div>'}</section><section class="card"><div class="asset-top"><h2>Assets</h2><a class="button" href="assets.html">View all</a></div><div class="asset-list">${assets.map(a=>`<a class="asset-card" data-search="${esc(a.symbol+' '+a.production_status+' '+a.regime+' '+a.next_action)}" href="assets.html?asset=${encodeURIComponent(a.asset_id)}"><div class="asset-top"><div><div class="eyebrow">${esc(a.production_status)}</div><div class="asset-name">${esc(a.symbol)}</div></div><span class="status ${cssState(a.production_status==='RESEARCH'?'RESEARCH':a.entry_allowed?'READY':'WAIT')}">${a.production_status==='RESEARCH'?'RESEARCH':a.entry_allowed?'READY':'WAIT'}</span></div><div class="asset-meta"><span class="status blue">${esc(a.regime)}</span><span class="status ${cssState(a.health_status)}">Health ${fmt(a.health_score)}</span></div><div class="scoreline"><span class="score">${fmt(a.opportunity_score)}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(a.opportunity_score)||0))}%"></i></div></div><p class="muted small">${esc(a.next_action)}</p></a>`).join('')}</div></section><section class="card"><h2>System status</h2><div class="grid"><div class="metric"><span>Market data</span><strong>${data.workflow_status==='ok'?'Healthy':'Review'}</strong></div><div class="metric"><span>3Commas</span><strong>${tc.status==='ok'||tc.status==='connected'?'Connected':'Read-only'}</strong></div><div class="metric"><span>Generated</span><strong>${new Date(data.generated_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</strong></div><div class="metric"><span>Execution</span><strong>Manual only</strong></div></div></section>`;addSearch(data)}).catch(err=>document.getElementById('root').innerHTML=`<section class="card"><h2>Home unavailable</h2><p>${esc(err.message)}</p></section>`);
</script></body></html>
