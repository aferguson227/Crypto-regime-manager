<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101d"><title>Data</title><link rel="stylesheet" href="v20.css"></head><body><div class="shell"><header class="topbar"><div><div class="eyebrow">Crypto Regime Manager</div><h1>Data</h1><p class="sub">Market freshness, replay coverage and technical integrity.</p></div><span id="version" class="version">V20.0.0</span></header><div class="search"><input id="globalSearch" placeholder="Search assets and sections…" aria-label="Search"></div><main id="root"><section class="card">Loading Data…</section></main></div><div id="nav"></div><script src="v20.js"></script><script>document.getElementById('nav').innerHTML=nav('data');
getAll().then(({data,release})=>{document.getElementById('version').textContent='V'+esc(release.version||'20.0.0');const assets=data.assets||[];document.getElementById('root').innerHTML=`<section class="card hero"><div class="asset-top"><div><div class="eyebrow">Data quality</div><h2>${data.workflow_status==='ok'?'Healthy':'Review required'}</h2></div><span class="status ${data.workflow_status==='ok'?'green':'red'}">${data.workflow_status==='ok'?'READY':'CHECK'}</span></div><p class="muted">Completed KuCoin four-hour candles drive current decisions. Historical diagnostics remain separate from independent forward evidence.</p></section><section class="card"><h2>Configured assets</h2><div class="asset-list">${assets.map(a=>{const sync=a.sync||{};return `<div class="asset-card" data-search="${esc(a.symbol+' '+a.history_end+' '+(sync.error||''))}"><div class="asset-top"><div class="asset-name">${esc(a.symbol)}</div><span class="status ${sync.error?'red':'green'}">${sync.error?'REVIEW':'HEALTHY'}</span></div><div class="grid"><div class="metric"><span>Latest completed candle</span><strong>${esc(a.history_end)}</strong></div><div class="metric"><span>New candles</span><strong>${fmt(sync.new_candles)}</strong></div><div class="metric"><span>Closed deals</span><strong>${fmt(a.closed_deals)}</strong></div><div class="metric"><span>Source</span><strong>KuCoin 4H</strong></div></div>${sync.error?`<div class="action redaction">${esc(sync.error)}</div>`:''}</div>`}).join('')}</div></section><section class="card"><h2>Data tools</h2><div class="links"><a class="linkcard" href="integrity.html"><strong>Integrity audit</strong><span class="muted">Freshness, errors and coverage.</span></a><a class="linkcard" href="pipeline.html"><strong>Pipeline</strong><span class="muted">Automated research processing.</span></a><a class="linkcard" href="timeline.html"><strong>Decision history</strong><span class="muted">Changes generated from new data.</span></a><a class="linkcard" href="cockpit.html"><strong>Operations audit</strong><span class="muted">Legacy detailed cockpit.</span></a></div></section>`;addSearch(data)}).catch(err=>document.getElementById('root').innerHTML=`<section class="card"><h2>Data unavailable</h2><p>${esc(err.message)}</p></section>`);
</script></body></html>
