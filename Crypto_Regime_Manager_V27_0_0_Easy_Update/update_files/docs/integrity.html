<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="stylesheet" href="v20.css"><title>Data Integrity</title><style>:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#263b54;--text:#f4f7fb;--muted:#a7b7ca;--ok:#66dfb5;--warn:#ffd76b;--bad:#ff8093;--blue:#6db7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{max-width:960px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 16px 50px}h1{font-size:38px;margin:10px 0}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:25px;padding:22px;margin:16px 0}.metric{background:#091626;border:1px solid var(--line);border-radius:16px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}a{color:#9fd0ff}.version{background:#25405e;padding:9px 13px;border-radius:99px;font-weight:800}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}</style><link rel="stylesheet" href="v24.css"></head><body><main><div class="head"><div><h1>Data Integrity</h1><p class="muted">Freshness, candle continuity and replay coverage checks for configured KuCoin assets.</p></div><span class="version">V27.0.0</span></div><div class="v20-tools"><a href="explainability.html">Why this decision</a><a href="timeline.html">Timeline</a><a href="integrity.html">Data integrity</a></div><div id="content"><section class="panel">Loading…</section></div><script>
async function run(){const d=await (await fetch('strategies.json?t='+Date.now(),{cache:'no-store'})).json();document.getElementById('content').innerHTML=d.assets.map(a=>{const s=a.sync||{},issues=[];if(s.error)issues.push(s.error);if(!a.history_end)issues.push('Missing history end');const score=Math.max(0,100-(issues.length*30)-(s.error?20:0));return `<section class="panel"><h2>${esc(a.symbol)}</h2><div class="integrity-grid"><div class="metric"><span>Integrity score</span><strong class="integrity-score">${score}/100</strong></div><div class="metric"><span>Latest candle</span><strong>${esc(a.history_end||'—')}</strong></div><div class="metric"><span>Closed replay deals</span><strong>${fmt(a.closed_deals,0)}</strong></div><div class="metric"><span>New candles last run</span><strong>${fmt(s.new_candles,0)}</strong></div></div><p class="muted">${issues.length?'Review: '+esc(issues.join(' · ')):'No reported sync errors. Existing history retained and merged by timestamp.'}</p></section>`}).join('')}
run().catch(e=>document.getElementById('content').innerHTML='<section class="panel">'+esc(e.message)+'</section>');
</script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=(n,d=1)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';</script></main><a class="v24-dashboard-home" href="index.html">← Dashboard</a><script src="v26.js"></script></body></html>
