<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101d"><title>Research</title><link rel="stylesheet" href="v20.css"></head><body><div class="shell"><header class="topbar"><div><div class="eyebrow">Crypto Regime Manager</div><h1>Research</h1><p class="sub">Candidates, validation, evidence and Asset DNA in one workflow.</p></div><span id="version" class="version">V20.0.0</span></header><div class="search"><input id="globalSearch" placeholder="Search assets and sections…" aria-label="Search"></div><main id="root"><section class="card">Loading Research…</section></main></div><div id="nav"></div><script src="v20.js"></script><script>document.getElementById('nav').innerHTML=nav('research');
getAll().then(({data,release})=>{document.getElementById('version').textContent='V'+esc(release.version||'20.0.0');const ci=data.candidate_intelligence||{},fv=(data.forward_validation||{}).candidates||[],auto=data.autonomous_evolution||{},cands=ci.candidates||[];document.getElementById('root').innerHTML=`<section class="card hero"><div class="eyebrow">Research lifecycle</div><h2>Evidence before deployment</h2><div class="workflow"><div class="step">Candidate</div><div class="step">Experiment</div><div class="step current">Forward validation</div><div class="step">Evidence</div><div class="step">Promotion</div></div><p class="muted">Research remains isolated from production and requires manual approval.</p></section><section class="card"><h2>Current candidates</h2>${cands.length?cands.map(c=>`<details class="disclosure" data-search="${esc((c.candidate_id||'')+' '+(c.human_rule||''))}" open><summary>${esc(c.candidate_id)} · ${esc(c.status)}</summary><p>${esc(c.human_rule||'Frozen research candidate')}</p><div class="grid"><div class="metric"><span>Confidence</span><strong>${fmt(c.diagnostic_confidence,0)}%</strong></div><div class="metric"><span>Lifecycle</span><strong>${esc(c.status)}</strong></div></div></details>`).join(''):'<div class="empty">No candidate records available.</div>'}</section><section class="card"><h2>Forward validation</h2>${fv.length?fv.map(v=>`<details class="disclosure" data-search="${esc(v.candidate_id+' '+v.status)}" open><summary>${esc(v.candidate_id)} · ${esc(v.status)}</summary><div class="grid"><div class="metric"><span>Days</span><strong>${fmt(v.forward_days,1)}</strong></div><div class="metric"><span>Candles</span><strong>${fmt(v.forward_candles)}</strong></div><div class="metric"><span>Deals</span><strong>${fmt(v.candidate_metrics&&v.candidate_metrics.closed_deals)}</strong></div><div class="metric"><span>Gates passed</span><strong>${Object.values(v.checks||{}).filter(Boolean).length}/${Object.keys(v.checks||{}).length}</strong></div></div><div class="action"><strong>Current outcome</strong><div>${esc(v.status)}</div></div></details>`).join(''):'<div class="empty">No forward tests are running.</div>'}</section><section class="card"><h2>Research intelligence</h2><div class="links"><a class="linkcard" href="evidence.html"><strong>Evidence</strong><span class="muted">Detailed experiment comparisons.</span></a><a class="linkcard" href="dna.html"><strong>Asset DNA</strong><span class="muted">Cross-asset response patterns.</span></a><a class="linkcard" href="traits.html"><strong>Traits</strong><span class="muted">Context-specific behaviours.</span></a><a class="linkcard" href="candidates.html"><strong>Registry</strong><span class="muted">Immutable candidate history.</span></a><a class="linkcard" href="validation.html"><strong>Validation audit</strong><span class="muted">All independent gates.</span></a><a class="linkcard" href="evolution.html"><strong>Evolution</strong><span class="muted">Historical strategy learning.</span></a></div></section>`;addSearch(data)}).catch(err=>document.getElementById('root').innerHTML=`<section class="card"><h2>Research unavailable</h2><p>${esc(err.message)}</p></section>`);
</script></body></html>
