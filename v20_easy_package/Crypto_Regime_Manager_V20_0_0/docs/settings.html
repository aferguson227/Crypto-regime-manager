<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101d"><title>Strategy Settings</title><link rel="stylesheet" href="v20.css"></head><body><div class="shell"><header class="topbar"><div><div class="eyebrow">Crypto Regime Manager</div><h1>Strategy Settings</h1><p class="sub">Mobile-friendly, read-only configuration cards.</p></div><span id="version" class="version">V20.0.0</span></header><div class="search"><input id="globalSearch" placeholder="Search assets and sections…" aria-label="Search"></div><main id="root"><section class="card">Loading settings…</section></main></div><div id="nav"></div><script src="v20.js"></script><script>document.getElementById('nav').innerHTML=nav('more');
getAll().then(({data,release})=>{document.getElementById('version').textContent='V'+esc(release.version||'20.0.0');const assets=data.assets||[];document.getElementById('root').innerHTML=`<section class="card"><div class="section-tabs">${assets.map((a,i)=>`<button class="${i===0?'active':''}" data-id="${esc(a.id)}">${esc(a.symbol)}</button>`).join('')}</div><div id="settingsBody"></div></section>`;function render(id){const a=assets.find(x=>x.id===id),l=a.latest||{},b=l.bot_settings||{};document.querySelectorAll('.section-tabs button').forEach(x=>x.classList.toggle('active',x.dataset.id===id));document.getElementById('settingsBody').innerHTML=`<div class="asset-top"><div><div class="eyebrow">Active strategy</div><h2>${esc(a.symbol)} · ${esc(l.regime)}</h2></div><span class="status blue">READ ONLY</span></div><details class="regime" open><summary>${esc(l.regime)} regime</summary><div class="regime-grid">${[['Take profit',fmt(b.take_profit_pct,1)+'%'],['SO deviation',fmt(b.so_deviation_pct,1)+'%'],['Safety orders',fmt(b.safety_orders)],['Volume scale',fmt(b.volume_scale,2)],['Step scale',fmt(b.step_scale,2)],['Max capital','$'+fmt(b.max_capital,0)]].map(s=>`<div class="setting"><span>${s[0]}</span><strong>${s[1]}</strong></div>`).join('')}</div></details><div class="action"><strong>No live controls</strong><div>This page documents active settings but cannot modify a bot.</div></div>`}document.querySelectorAll('.section-tabs button').forEach(x=>x.onclick=()=>render(x.dataset.id));render(assets[0]?.id);addSearch(data)}).catch(err=>document.getElementById('root').innerHTML=`<section class="card"><h2>Settings unavailable</h2><p>${esc(err.message)}</p></section>`);
</script></body></html>
