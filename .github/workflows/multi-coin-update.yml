name: V31.2 Autonomous Crypto Regime Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "18 0,4,8,12,16,20 * * *"
permissions:
  contents: write
concurrency:
  group: crypto-regime-main-publisher
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronise with latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Validate Python
        run: python -m py_compile scripts/cloud_update.py scripts/validate_publish.py scripts/core/*.py
      - name: Run autonomous read-only refresh
        run: python scripts/cloud_update.py
      - name: Validate generated publication
        run: python scripts/validate_publish.py
      - name: Publish validated data atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/normalized docs
          python scripts/validate_publish.py
          if git diff --cached --quiet; then
            echo "No validated publication changes detected."
            exit 0
          fi
          git commit -m "V31.2 validated cloud refresh"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Remote changed; rebasing before retry ${attempt}/3"
            git fetch origin main
            git rebase origin/main
            python scripts/validate_publish.py
            sleep 5
          done
          exit 1
