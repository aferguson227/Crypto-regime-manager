name: CRM Safe Self-Heal
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crm-safe-self-heal
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved low-risk playbooks
        run: python -m scripts.self_healing_engine --apply-safe
      - name: Validate repaired state
        run: |
          python -m pytest -q
          python -m scripts.validate_publish
          python -m scripts.validate_release_metadata
          python -m scripts.workflow_policy
      - name: Commit approved generated repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics_runtime.json docs/self_healing_status.json docs/remediation_history.json RUN_DIAGNOSTICS.ps1
          git diff --cached --quiet || git commit -m "Apply approved CRM self-healing repairs"
          git pull --rebase origin main
          git push origin main
