name: CRM Release Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-release-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Full release validation
        run: |
          python -m scripts.engineering_scheduler --mode pre-release
          python -m pytest -q
          python -m scripts.validate_publish
          python -m scripts.validate_release_metadata
          python -m compileall -q app scripts tests
      - name: Build engineering evidence package
        run: python -m scripts.engineering_package --keep-generated
