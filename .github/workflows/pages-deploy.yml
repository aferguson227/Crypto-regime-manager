name: Deploy CRM Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments must finish in order. A new data refresh must not cancel
# the deployment currently publishing the site.
concurrency:
  group: crm-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate published site
        run: python -m scripts.validate_publish
      - name: Upload docs as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The previous workflow killed valid Pages deployments at exactly 10 minutes.
    # Allow GitHub's Pages service enough time to leave its deployment queue.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy latest CRM Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
