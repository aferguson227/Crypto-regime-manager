name: Update 3Commas Deal Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
permissions:
  contents: write
concurrency:
  group: crypto-regime-main-publisher
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RSA dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.7
      - name: Synchronise with latest main
        shell: bash
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Validate Python
        run: python -c "import app.release; import scripts.threecommas_sync; import scripts.integrations.threecommas; import scripts.cloud_reliability_engine"
      - name: Fetch read-only 3Commas data using RSA
        env:
          THREECOMMAS_API_KEY: ${{ secrets.THREECOMMAS_API_KEY }}
          THREECOMMAS_RSA_PRIVATE_KEY_B64: ${{ secrets.THREECOMMAS_RSA_PRIVATE_KEY_B64 }}
        run: python -m scripts.threecommas_sync
      - name: Rebuild dependent read-only intelligence
        run: |
          python -m scripts.account_intelligence_engine
          python -m scripts.capital_intelligence_engine
          python -m scripts.operating_state_engine
          python -m scripts.deployment_intelligence_engine
          python -m scripts.recommendation_intelligence_engine
          python -m scripts.portfolio_intelligence_engine
          python -m scripts.cloud_reliability_engine
          python -m scripts.operational_intelligence_engine
          python -m scripts.github_actions_intelligence_engine
          python -m scripts.decision_quality_engine
          python -m scripts.engineering_intelligence_engine
          python -m scripts.command_state_engine
      - name: Publish read-only dashboard data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/threecommas.json docs/account_intelligence.json docs/capital_intelligence.json docs/operating_state.json docs/deployment_intelligence.json docs/recommendation_intelligence.json docs/portfolio_intelligence.json docs/cloud_reliability.json docs/operational_health.json docs/issues.json docs/performance_history.json docs/command_state.json
          if git diff --cached --quiet; then
            echo "No 3Commas dashboard changes to commit."
            exit 0
          fi
          git commit -m "Update read-only 3Commas dashboard"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          exit 1
