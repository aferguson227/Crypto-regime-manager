name: Update 3Commas Deal Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: threecommas-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RSA dependency
        run: python -m pip install --disable-pip-version-check cryptography>=43,<47

      - name: Validate Python
        run: python -m py_compile scripts/threecommas_sync.py

      - name: Fetch read-only 3Commas data using RSA
        env:
          THREECOMMAS_API_KEY: ${{ secrets.THREECOMMAS_API_KEY }}
          THREECOMMAS_RSA_PRIVATE_KEY_B64: ${{ secrets.THREECOMMAS_RSA_PRIVATE_KEY_B64 }}
        run: python scripts/threecommas_sync.py

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/threecommas.json
          if git diff --cached --quiet; then
            echo "No 3Commas dashboard changes to commit."
          else
            git commit -m "Update read-only 3Commas RSA dashboard"
            git pull --rebase origin main
            git push
          fi
