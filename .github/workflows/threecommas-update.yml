name: Update 3Commas Deal Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
permissions:
  contents: write
concurrency:
  group: crypto-regime-main-publisher
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RSA dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.7
      - name: Synchronise with latest main
        shell: bash
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Validate Python
        run: python -m py_compile scripts/threecommas_sync.py
      - name: Fetch read-only 3Commas data using RSA
        env:
          THREECOMMAS_API_KEY: ${{ secrets.THREECOMMAS_API_KEY }}
          THREECOMMAS_RSA_PRIVATE_KEY_B64: ${{ secrets.THREECOMMAS_RSA_PRIVATE_KEY_B64 }}
        run: python scripts/threecommas_sync.py
      - name: Publish read-only dashboard data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/threecommas.json
          if git diff --cached --quiet; then
            echo "No 3Commas dashboard changes to commit."
            exit 0
          fi
          git commit -m "Update read-only 3Commas dashboard"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          exit 1
