<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Research Queue · V22</title><link rel="stylesheet" href="v20.css"><link rel="stylesheet" href="v22.css"><style>body{margin:0;background:linear-gradient(180deg,#07111f,#030912);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f7fb;min-height:100vh}.v20-nav,.v20-tools{max-width:100%}</style></head><body><main class="v22-shell"><header class="v22-head"><div><div class="v22-kicker">Decision Intelligence</div><h1>Automatic Research Queue</h1><p class="v22-lede">Prioritised, one-variable experiments with clear evidence, confidence and manual promotion gates.</p></div><span class="v22-version" id="version">V22.0.0</span></header><nav class="v20-nav"><a href="index.html">Dashboard</a><a href="cockpit.html">Cockpit</a><a href="research.html">Research</a><a class="active" href="research_queue.html">Queue</a><a href="data.html">Data</a><a href="more.html">More</a></nav><div class="v20-tools"><a href="explainability.html">Why this decision</a><a href="timeline.html">Timeline</a><a href="integrity.html">Data integrity</a></div><div id="app"><section class="v22-card"><p class="v22-muted">Loading research queue…</p></section></div></main><script>
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const num=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const money=v=>`${Number(v)<0?'−':''}$${Math.abs(Number(v||0)).toLocaleString(undefined,{maximumFractionDigits:2})}`;
const cls=v=>Number(v)>=0?'v22-ok':'v22-bad';
function confidence(row){const deals=Number(row.baseline?.closed_deals||0), exps=(row.experiments||[]).length;if(deals>=100&&exps>=6)return ['HIGH','ok'];if(deals>=25&&exps>=4)return ['MEDIUM','warn'];return ['LOW','neutral']}
function stages(hasWinner){return `<div class="v22-stage"><span class="done">Idea</span><span class="done">Diagnostic</span><span class="${hasWinner?'on':''}">Candidate</span><span>Forward test</span><span>Review</span><span>Approved</span><span>Production</span></div>`}
function experiment(x,i,winner){const c=x.comparison||{}, status=x.status||'REVIEW';return `<article class="v22-candidate ${winner?'winner':''}"><div class="v22-candidate-head"><div><div class="v22-kicker">${winner?'Recommended candidate':'Alternative '+(i+1)}</div><h3>${esc(x.title)}</h3></div><span class="v22-pill ${status==='PASS'?'ok':'bad'}">${esc(status)}</span></div><p class="v22-muted">${esc(x.human_rule)}</p><div class="v22-rule">Only amended variable: ${esc(x.field)} → ${esc(x.value)}</div><div class="v22-grid"><div class="v22-metric"><span>Rank score</span><strong>${num(x.rank_score,1)}</strong></div><div class="v22-metric"><span>Net improvement</span><strong class="${cls(c.net_pnl_change)}">${money(c.net_pnl_change)}</strong></div><div class="v22-metric"><span>Duration reduced</span><strong>${num(Number(c.duration_reduction_hours||0)/24,1)}d</strong></div><div class="v22-metric"><span>Drawdown change</span><strong>${num(c.drawdown_change_pp,1)}pp</strong></div><div class="v22-metric"><span>Deal retention</span><strong>${num(c.deal_retention_pct,1)}%</strong></div><div class="v22-metric"><span>Problem trade changed</span><strong>${c.problem_trade_changed?'YES':'NO'}</strong></div></div></article>`}
function rowCard(row){const w=row.recommended_experiment, conf=confidence(row), exp=row.experiments||[], progress=Math.max(0,Math.min(100,100-Number(row.weakness_score||0)/1.4));return `<section class="v22-card accent"><div class="v22-row"><div><span class="v22-pill purple">Priority ${esc(row.priority)}</span><div class="v22-kicker" style="margin-top:14px">${esc(row.production_status||'research')}</div><h2>${esc(row.asset_id)} · ${esc(row.target_regime)}</h2></div><div><span class="v22-pill ${conf[1]}">Evidence ${conf[0]}</span><div class="v22-muted" style="margin-top:12px">Weakness score</div><div class="v22-score">${num(row.weakness_score,1)}</div></div></div><div class="v22-progress"><i style="width:${progress}%"></i></div><ul class="v22-list">${(row.weakness_reasons||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${stages(!!w)}<h3 class="${w?'v22-ok':'v22-warn'}">${esc(row.status)}</h3>${w?experiment(w,0,true):`<div class="v22-note">No robust improvement has passed the current diagnostic gates. Keep the production baseline unchanged.</div>`}<div class="v22-action"><strong>Next manual action</strong>${esc(row.next_action)}</div>${exp.length?`<details class="v22-details"><summary>Compare all ${exp.length} experiments</summary>${exp.filter(x=>!w||x.experiment_id!==w.experiment_id).map((x,i)=>experiment(x,i,false)).join('')}</details>`:''}</section>`}
Promise.all([fetch('strategies.json?t='+Date.now(),{cache:'no-store'}),fetch('version.json?t='+Date.now(),{cache:'no-store'})]).then(async([sr,vr])=>{if(!sr.ok)throw Error('Strategy data HTTP '+sr.status);const data=await sr.json(),release=vr.ok?await vr.json():{version:'22.0.0'},q=data.research_queue||{},rows=q.queue||[];document.getElementById('version').textContent='V'+(release.version||'22.0.0');let html=`<section class="v22-card"><div class="v22-row"><div><span class="v22-pill purple">ADVISORY ONLY</span><h2>${esc(q.status||'READY')}</h2><p class="v22-muted">${esc(q.note||'The queue cannot alter live bots or production settings.')}</p></div><span class="v22-pill bad">LIVE CHANGES DISABLED</span></div><div class="v22-grid"><div class="v22-metric"><span>Assets reviewed</span><strong>${esc(q.summary?.assets_reviewed||0)}</strong></div><div class="v22-metric"><span>Experiments run</span><strong>${esc(q.summary?.experiments_run||0)}</strong></div><div class="v22-metric"><span>Candidate assets</span><strong>${esc(q.summary?.assets_with_candidate||0)}</strong></div><div class="v22-metric"><span>Manual review</span><strong>${rows.filter(r=>r.recommended_experiment).length}</strong></div></div></section>`;html+=rows.length?rows.map(rowCard).join(''):`<section class="v22-card v22-empty">No assets currently require research.</section>`;html+=`<section class="v22-card soft"><h2>Promotion safeguards</h2><div class="v22-grid"><div class="v22-metric"><span>Automatic production changes</span><strong class="v22-bad">DISABLED</strong></div><div class="v22-metric"><span>One-variable experiments</span><strong class="v22-ok">REQUIRED</strong></div><div class="v22-metric"><span>Independent forward evidence</span><strong class="v22-warn">REQUIRED</strong></div><div class="v22-metric"><span>Manual approval</span><strong class="v22-warn">REQUIRED</strong></div></div></section>`;document.getElementById('app').innerHTML=html}).catch(err=>document.getElementById('app').innerHTML=`<section class="v22-card"><h2>Unable to load queue</h2><p class="v22-bad">${esc(err.message)}</p></section>`);
</script></body></html>
